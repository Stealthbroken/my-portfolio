const STORAGE_KEY='cabinet-crisis:v1';
let inMemory={days:{}};let storageWorking=true;
function load(){try{let raw=localStorage.getItem(STORAGE_KEY);if(raw){let d=JSON.parse(raw);if(d&&d.days&&typeof d.days==='object')return d;}}catch(e){storageWorking=false;}return {days:{}};}
let db=load(),screen='today',viewIndex=0,archiveDay=null,archiveCase=null,showBreakdown=false;
const app=document.getElementById('app');
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));}catch(e){storageWorking=false;}}
function todayKey(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayNum(key){let [y,m,d]=key.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000);}
function issueNum(key){return String((dayNum(key)-dayNum('2026-01-01')+1000000)%1000000).padStart(4,'0');}
function dateLabel(key,long){let [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-CA',{month:long?'long':'short',day:'numeric',year:'numeric'});}
function casesFor(key){let n=dayNum(key);return CATEGORY.map((c,i)=>{let pool=BANK[c.key];return pool[(n+i*5)%pool.length];});}
function getDay(key=todayKey()){return db.days[key]||null;}
function ensureDay(key=todayKey()){if(!db.days[key]){db.days[key]={started:true,completed:false,records:Array.from({length:7},()=>({tries:[],hint:false})),finishedAt:null};save();}return db.days[key];}
function points(rec,correct){if(!rec||!rec.tries.length||!rec.tries.includes(correct))return 0;return Math.max(0,(rec.tries.length===1?100:50)-(rec.hint?25:0));}
function solved(rec,correct){return !!rec&&(rec.tries.includes(correct)||rec.tries.length>=2);}
function total(day,cases){return day?day.records.reduce((sum,r,i)=>sum+points(r,cases[i].correct),0):0;}
function completedCount(day,cases){return day?day.records.filter((r,i)=>solved(r,cases[i].correct)).length:0;}
function firstUnsolved(day,cases){return day?day.records.findIndex((r,i)=>!solved(r,cases[i].correct)):0;}
function rank(score){return score>=650?'Master Strategist':score>=550?'Cabinet Secretary':score>=420?'Senior Adviser':score>=270?'Policy Analyst':'Junior Adviser';}
function ranksSummary(score){return score>=650?'Your briefing is exceptionally sharp.':score>=550?'You handled the cabinet floor with confidence.':score>=420?'A sound day of decisions, with a few lessons retained.':score>=270?'Your judgment is developing; the debriefs are worth reviewing.':'A difficult briefing. Each case has something to teach.';}
function completedKeys(){return Object.keys(db.days).filter(k=>db.days[k]?.completed).sort();}
function streak(){let keys=new Set(completedKeys());let n=0;let d=todayKey(),k=dayNum(d);if(!keys.has(d))k--;while(keys.has(keyFromDayNum(k))){n++;k--;}return n;}
function keyFromDayNum(n){let d=new Date(n*86400000);return d.toISOString().slice(0,10);}
function bestScore(){let vals=completedKeys().map(k=>total(db.days[k],casesFor(k)));return vals.length?Math.max(...vals):0;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const e=escapeHtml;
function wrapHero(label,heading,description,key=todayKey()){
return `<section class="hero"><div><div class="eyebrow">${label}</div><h1 class="serif">${heading}</h1><p>${description}</p></div><div class="issue-mark"><div class="issue-num">№ ${issueNum(key)}</div><div class="issue-cap">Daily issue</div><div class="issue-date">${dateLabel(key,true)}</div></div></section>`;
}
function render(){let key=todayKey();document.getElementById('header-date').textContent=dateLabel(key,true).toUpperCase();let st=streak();document.getElementById('header-streak').innerHTML=st?`STREAK <strong>${st}</strong>`:'';document.getElementById('nav-today').classList.toggle('active',screen==='today');document.getElementById('nav-archive').classList.toggle('active',screen==='archive'||screen==='review');if(screen==='today')renderToday();else if(screen==='archive')renderArchive();else if(screen==='review')renderReview();}
function renderToday(){let key=todayKey(),day=getDay(key),cases=casesFor(key);if(!day){app.innerHTML=wrapHero('A daily exercise in statecraft','The Daily Briefing','A fresh slate of seven decisions. No clock, no campaign slogans, just evidence and reasoning.')+introHtml(key);return;}
let progress=completedCount(day,cases);if(day.completed){app.innerHTML=wrapHero('Daily issue concluded','Briefing complete',`Your decisions are on the record. The next briefing arrives with the next local calendar day.`)+summaryHtml(key,day,cases);return;}
if(viewIndex<0||viewIndex>=7)viewIndex=firstUnsolved(day,cases);let frontier=firstUnsolved(day,cases);if(frontier>=0&&viewIndex>frontier)viewIndex=frontier;let index=viewIndex,rec=day.records[index],cq=cases[index];app.innerHTML=wrapHero('Classified / issue '+issueNum(key),'The situation room',`Seven dossiers. ${progress} filed, ${7-progress} awaiting a decision.`)+`<section class="content-area"><div class="layout"><aside class="rail"><div class="rail-head"><span>Cabinet docket</span><span>${progress} / 7 complete</span></div><div class="rail-list">${cases.map((c,i)=>{let done=solved(day.records[i],c.correct),locked=frontier>=0&&i>frontier;return `<button class="rail-case ${i===index?'current':''} ${locked?'locked':''}" data-action="case" data-index="${i}" ${locked?'disabled':''} aria-label="Case ${i+1}: ${CATEGORY[i].name}${done?', completed':''}"><span class="rail-number">${String(i+1).padStart(2,'0')}</span><span class="rail-copy"><b>${CATEGORY[i].name}</b><small>${CATEGORY[i].tag}</small></span><span class="rail-status">${done?'✓':i===index?'●':locked?'—':''}</span></button>`}).join('')}</div><div class="rail-stats"><div class="stat-row"><span>Points earned</span><strong>${total(day,cases)} / 700</strong></div><div class="stat-row"><span>Cases filed</span><b>${progress} of 7</b></div><div class="progress-track"><div class="progress-fill" style="width:${progress/7*100}%"></div></div></div></aside><div class="case-paper paper">${caseHtml(cq,index,rec,day,frontier)}</div></div></section>`;
}
function introHtml(key){return `<section class="content-area"><div class="intro-card paper"><div class="eyebrow">Confidential · Cabinet Office</div><h2 class="big-title">Seven decisions.<br>One cabinet.</h2><p class="lead">You have been appointed Chief Strategic Adviser. Each day, face seven cases spanning law, diplomacy, geography, economics and the machinery of government. Select the most defensible recommendation, then read the debrief.</p><div class="intro-meta"><div><strong>07</strong><span>Cases</span></div><div><strong>700</strong><span>Maximum points</span></div><div><strong>∞</strong><span>No timer</span></div></div><div class="introduction-footer"><button class="btn" data-action="begin">Open today's dossier <span class="arrow">→</span></button><span class="subnote">One curated issue per local date · Saves on this device</span></div></div><div class="preview-list">${CATEGORY.map((c,i)=>`<div class="preview-item"><span class="preview-count">${String(i+1).padStart(2,'0')}</span><div><b>${c.name}</b><span>${c.tag}</span></div></div>`).join('')}</div></section>`;}
function mapHtml(map){if(!map)return '';const x=(map.lon+180)*3,y=(90-map.lat)*3;let vw=map.width||270,vh=vw*.60;let grid='';for(let lon=-180;lon<=180;lon+=10){let gx=(lon+180)*3;grid+=`<line x1="${gx}" y1="0" x2="${gx}" y2="540" stroke="#c1cfca" stroke-width=".45"/>`;}for(let lat=-80;lat<=80;lat+=10){let gy=(90-lat)*3;grid+=`<line x1="0" y1="${gy}" x2="1080" y2="${gy}" stroke="#c1cfca" stroke-width=".45"/>`;}
return `<div class="map-outer"><div class="map-head">Geographic evidence / ${e(map.region)}</div><svg class="map-wrap" role="img" aria-label="Map of ${e(map.region)} with a location circled" viewBox="${(x-vw/2).toFixed(1)} ${(y-vh/2).toFixed(1)} ${vw} ${vh}" preserveAspectRatio="xMidYMid meet"><rect width="1080" height="540" fill="#dce8e5"/>${grid}<g fill="#f7f7f2" stroke="#98aca6" stroke-width=".9" stroke-linejoin="round">${WORLD_PATHS}</g><circle cx="${x}" cy="${y}" r="13" fill="#9d4a42" fill-opacity=".13" stroke="#9d4a42" stroke-width="1.9" stroke-dasharray="3 2"/><circle cx="${x}" cy="${y}" r="3.4" fill="#9d4a42" stroke="white" stroke-width="1.1"/></svg><div class="map-note">● Area under review</div></div><p class="map-caption">An annotated geographical reference. Borders and coastlines are generalized.</p>`;}
function caseHtml(c,i,rec,day,frontier,readOnly=false){let done=solved(rec,c.correct),canAnswer=!done&&!readOnly,attempts=rec?.tries||[],hint=rec?.hint||false,pts=points(rec,c.correct),correct=attempts.includes(c.correct);let ev=c.evidence||[];
return `<div class="case-topline"><strong>Case ${String(i+1).padStart(2,'0')} / 07 &nbsp;·&nbsp; ${CATEGORY[i].desk}</strong><span>${CATEGORY[i].short} / ${done?'FILED':'PENDING'}</span></div><div class="case-body"><div class="eyebrow">Office of the Chief Strategic Adviser</div><h2>${e(c.title)}</h2><p class="prompt">${e(c.scenario)}</p>${ev.length?`<div class="evidence ${ev.length===1?'single':''}">${ev.map(v=>`<div class="evidence-card"><h4>${e(v[0])}</h4><p>${e(v[1])}</p></div>`).join('')}</div>`:''}${mapHtml(c.map)}<div class="case-question">${e(c.question)}</div><div class="answer-heading"><strong>Choose your recommendation</strong><small>${done?'Decision recorded':attempts.length?'One attempt remaining':'One correct answer · Two attempts'}</small></div><div class="answers">${c.choices.map((choice,j)=>{let wrong=attempts.includes(j)&&j!==c.correct;let good=done&&j===c.correct;let cls=good?'mark-right':wrong?'mark-wrong':done?'dimmed':'';let mark=good?'✓':wrong?'×':'';return `<button class="answer ${cls}" data-action="answer" data-choice="${j}" ${canAnswer&&!attempts.includes(j)?'':'disabled'} aria-label="Choice ${'ABCD'[j]}: ${e(choice)}"><span class="choice-letter">${'ABCD'[j]}</span><span class="choice-copy">${e(choice)}</span>${mark?`<span class="answer-mark">${mark}</span>`:''}</button>`}).join('')}</div>${!done&&attempts.length?`<div class="callout" role="status">Your first recommendation does not follow from the evidence. You have one remaining attempt; a correct revision is worth ${hint?'25':'50'} points.</div>`:''}${!done&&hint?`<div class="hint-box"><strong>Adviser’s note:</strong> ${e(c.hint)}</div>`:''}${!done?`<div class="case-footer"><button class="hint-button" data-action="hint" ${hint?'disabled':''}>${hint?'Adviser’s note revealed (−25 pts)':'Request an adviser’s note (−25 pts)'}</button><span class="subnote">${attempts.length?'Second and final recommendation':'No time limit'}</span></div>`:''}${done?`<section class="debrief"><div class="debrief-head"><div class="eyebrow">${correct?'Recommendation accepted':'Recommendation declined'} · ${readOnly?'Archived dossier':'Case filed'}</div><div class="points-amount">+${pts}<em>points</em></div></div><h3>The debrief</h3><p>${e(c.explanation)}</p><div class="fun-fact"><b>Beyond the briefing</b>${e(c.insight)}</div><div class="answer-summary"><button data-action="breakdown">${showBreakdown?'Hide':'Show'} the decision breakdown ${showBreakdown?'−':'+'}</button>${showBreakdown?`<div class="breakdown-list">${c.choices.map((ch,j)=>`<div class="breakdown-item"><b>${'ABCD'[j]} · ${e(ch)} ${j===c.correct?'(Correct)':''}</b>${j===c.correct?e(c.explanation):`Compare this option with the required conditions described in the debrief above; it does not meet them.`}</div>`).join('')}</div>`:''}</div>${!readOnly?`<div class="case-footer"><span class="subnote">${i===6?'All seven cases have been considered.':`Case ${i+1} of 7 filed.`}</span><button class="btn" data-action="next">${i===6?'View daily results':'Next case'} <span class="arrow">→</span></button></div>`:''}</section>`:''}</div>`;}
function summaryHtml(key,day,cases){let score=total(day,cases);let first=day.records.filter((r,i)=>r.tries.length===1&&r.tries[0]===cases[i].correct).length;let used=day.records.filter(r=>r.hint).length;return `<section class="content-area"><div class="summary-paper paper"><div class="eyebrow">End of day · Issue ${issueNum(key)}</div><h2>Decisions on the record.</h2><p class="summary-sub">${ranksSummary(score)} Your seven cases have been filed for ${dateLabel(key,true)}.</p><div class="score-hero"><div><strong>${score}</strong><span class="out-of">/ 700</span></div><div class="rank"><small>Today's designation</small>${rank(score)}</div></div><div class="results-grid">${day.records.map((r,i)=>{let p=points(r,cases[i].correct);return `<div class="result-tile ${p>=75?'':p>0?'partial':'fail'}"><strong>${p}</strong><span>${CATEGORY[i].short}</span></div>`}).join('')}</div><div class="metrics"><div class="metric"><strong>${first} / 7</strong><span>First-attempt solves</span></div><div class="metric"><strong>${used}</strong><span>Adviser notes used</span></div><div class="metric"><strong>${streak()}</strong><span>Day streak</span></div></div><div class="summary-actions"><button class="btn" data-action="share">Share results <span class="arrow">↗</span></button><button class="btn secondary" data-action="archive">Open archive</button></div><div class="summary-review"><h3 class="section-label">Review your decisions</h3>${cases.map((c,i)=>`<button data-action="review" data-date="${key}" data-index="${i}"><span><b>${String(i+1).padStart(2,'0')} · ${e(c.title)}</b><small>${CATEGORY[i].name}</small></span><span class="points">+${points(day.records[i],c.correct)}</span></button>`).join('')}</div></div></section>`;}
function renderArchive(){let keys=Object.keys(db.days).sort().reverse();app.innerHTML=wrapHero('Classified records','The archive','Every completed briefing stays on this device for review. Prior cases can be read but not replayed.')+`<section class="content-area"><div class="archive-paper paper"><div class="eyebrow">Personal dossier</div><h2>Past briefings</h2><p class="desc">${keys.length} issue${keys.length===1?'':'s'} opened · ${completedKeys().length} finished · Best result ${bestScore()} / 700</p>${keys.length?keys.map(k=>{let d=db.days[k],cases=casesFor(k),done=completedCount(d,cases);return `<div class="archive-entry"><div><h3>${dateLabel(k,true)}</h3><p>Issue ${issueNum(k)} &nbsp;·&nbsp; ${d.completed?'Completed':'In progress'} &nbsp;·&nbsp; ${done} / 7 cases</p></div><div class="archive-entry-right"><strong>${total(d,cases)} / 700</strong><button class="btn secondary btn-sm" data-action="open-archive-day" data-date="${k}">Review dossier</button></div></div>`}).join(''):`<div class="archive-empty">No briefings on file yet.<p>Complete today's seven decisions to create your first record.</p><button class="btn secondary btn-sm" data-action="today">Today's issue</button></div>`}</div></section>`;}
function renderReview(){let key=archiveDay,day=db.days[key];if(!day){screen='archive';render();return;}let cases=casesFor(key);if(archiveCase==null){app.innerHTML=wrapHero('Personal archive','Issue '+issueNum(key),`Your record of ${dateLabel(key,true)}. These decisions are preserved exactly as submitted.`,key)+`<section class="content-area"><div class="archive-paper paper"><button class="breadcrumb" data-action="archive">← All archived issues</button><div class="eyebrow">Briefing report</div><h2>${day.completed?'Issue concluded':'Partial issue'}</h2><p class="desc">${total(day,cases)} points earned · ${completedCount(day,cases)} of 7 filed</p><div class="summary-review">${cases.map((c,i)=>{let done=solved(day.records[i],c.correct);return `<button data-action="review" data-date="${key}" data-index="${i}" ${done?'':'disabled'}><span><b>${String(i+1).padStart(2,'0')} · ${e(c.title)}</b><small>${CATEGORY[i].name} ${done?'':'· Not yet filed'}</small></span><span class="points">${done?'+'+points(day.records[i],c.correct):'—'}</span></button>`}).join('')}</div></div></section>`;return;}
let i=archiveCase,c=cases[i],rec=day.records[i];app.innerHTML=wrapHero('Retrospective / issue '+issueNum(key),'Decision review',`${CATEGORY[i].name} · ${dateLabel(key,true)}`,key)+`<section class="content-area"><div class="archive-detail paper"><button class="breadcrumb" data-action="open-archive-day" data-date="${key}">← Back to issue ${issueNum(key)}</button>${caseHtml(c,i,rec,day,7,true)}</div></section>`;}
function nextCase(){let day=getDay(),cases=casesFor(todayKey());if(!day)return;let frontier=firstUnsolved(day,cases);showBreakdown=false;if(frontier===-1){day.completed=true;day.finishedAt=Date.now();save();screen='today';window.scrollTo({top:0,behavior:'smooth'});render();return;}viewIndex=frontier;window.scrollTo({top:0,behavior:'smooth'});render();}
function chooseAnswer(j){let key=todayKey(),day=getDay(key);if(!day||day.completed)return;let i=viewIndex,case_=casesFor(key)[i],rec=day.records[i];if(solved(rec,case_.correct)||rec.tries.includes(j))return;rec.tries.push(j);save();showBreakdown=false;render();if(solved(rec,case_.correct)){setTimeoutSafeFocus();}}
function setTimeoutSafeFocus(){/* Focus remains on the selected case for debrief reading. */}
function toggleHint(){let day=getDay(),case_=casesFor(todayKey())[viewIndex],r=day?.records?.[viewIndex];if(!r||r.hint||solved(r,case_.correct))return;r.hint=true;save();render();}
function shareText(){let key=todayKey(),day=getDay(key),cases=casesFor(key);if(!day)return '';let score=total(day,cases);let cells=day.records.map((r,i)=>{let p=points(r,cases[i].correct);return p>=75?'■':p>0?'▣':'□';});return `CABINET CRISIS · ${dateLabel(key,true).toUpperCase()}\n${score}/700 · ${rank(score)}\n${cells.join(' ')}\n${streak()} day streak\nSeven decisions. One cabinet.`;}
async function shareResults(){let txt=shareText();if(navigator.share){try{await navigator.share({title:'Cabinet Crisis · The Daily Briefing',text:txt});return;}catch(err){if(err.name==='AbortError')return;}}try{await navigator.clipboard.writeText(txt);toast('Results copied to clipboard');return;}catch(e){}const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();let ok=document.execCommand('copy');t.remove();toast(ok?'Results copied to clipboard':'Select and copy your results manually');if(!ok)window.prompt('Copy your results:',txt);}
let toastTimer=null;function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('shown');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('shown'),2600);}
function about(){document.getElementById('overlay').innerHTML=`<div class="dialog-backdrop" data-action="close-about"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="about-title"><div class="eyebrow">Cabinet office / procedures</div><h2 id="about-title">How to play</h2><p>Each local calendar date brings seven curated cases, selected consistently for that date, with no timer.</p><ol><li>Read the scenario and any evidence; choose one of four recommendations.</li><li>Correct first attempt: <b>100 points</b>. Correct second attempt: <b>50 points</b>. Two misses: <b>0 points</b>.</li><li>An optional adviser note subtracts <b>25 points</b> from a successful case. No score can go below zero.</li><li>Review the debrief, move to the next case, and finish all seven to record your daily streak.</li><li>Your progress and archive are saved only in this browser. Clearing browser site data or using a different device will not transfer your record.</li></ol><p>Questions use established institutional knowledge and clearly stated hypothetical premises. The geographical maps use generalized geographic boundaries. The curated question bank rotates over multiple days; future updates can add more cases.</p><div class="dialog-footer"><button class="btn" data-action="close-about">Understood</button></div></section></div>`;}
function closeAbout(){document.getElementById('overlay').innerHTML='';}
function navigate(to){screen=to;archiveDay=null;archiveCase=null;showBreakdown=false;if(to==='today'){let day=getDay(),cs=casesFor(todayKey());if(day&&!day.completed){let n=firstUnsolved(day,cs);viewIndex=n<0?6:n;}}window.scrollTo({top:0,behavior:'smooth'});render();}
document.addEventListener('click',event=>{const t=event.target.closest('[data-action]');if(!t)return;let a=t.dataset.action;if(a==='close-about'){if(event.target.closest('.dialog')&&t.classList.contains('dialog-backdrop'))return;closeAbout();return;}if(a==='begin'){ensureDay();viewIndex=0;render();return;}if(a==='today'||a==='archive'){navigate(a==='today'?'today':'archive');return;}if(a==='case'){let n=Number(t.dataset.index),day=getDay(),front=firstUnsolved(day,casesFor(todayKey()));if(n<=front||front===-1){viewIndex=n;showBreakdown=false;render();}return;}if(a==='answer'){chooseAnswer(Number(t.dataset.choice));return;}if(a==='hint'){toggleHint();return;}if(a==='next'){nextCase();return;}if(a==='breakdown'){showBreakdown=!showBreakdown;render();return;}if(a==='share'){shareResults();return;}if(a==='open-archive-day'){archiveDay=t.dataset.date;archiveCase=null;screen='review';window.scrollTo({top:0,behavior:'smooth'});render();return;}if(a==='review'){archiveDay=t.dataset.date;archiveCase=Number(t.dataset.index);screen='review';window.scrollTo({top:0,behavior:'smooth'});render();return;}});
document.getElementById('nav-today').addEventListener('click',()=>navigate('today'));
document.getElementById('nav-archive').addEventListener('click',()=>navigate('archive'));
document.getElementById('brand-home').addEventListener('click',()=>navigate('today'));
document.getElementById('about-link').addEventListener('click',about);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeAbout();return;}if(document.getElementById('overlay').innerHTML)return;if(screen==='today'&&getDay()&&!getDay().completed){let r=getDay().records[viewIndex],c=casesFor(todayKey())[viewIndex];if(/^[1-4]$/.test(ev.key)&&!solved(r,c.correct)){let j=Number(ev.key)-1;chooseAnswer(j);}if(ev.key.toLowerCase()==='h'&&!solved(r,c.correct))toggleHint();if(ev.key==='Enter'&&solved(r,c.correct))nextCase();}});
render();
</script>
</body>

q("The Emergency Decree","A prime minister announces a rule that will govern every citizen immediately. The constitution assigns lawmaking to parliament, except when a specific emergency power is lawfully invoked.",[["Cabinet note","No emergency declaration has been made."],["Legal note","Parliament has not passed the proposed measure."]],"Which objection is strongest?",["The decree is automatically valid because it concerns public safety.","The decree may lack a constitutional source of legislative authority.","Every executive policy must first win a referendum.","A court can never review an emergency measure."],1,"Separate the desirability of a policy from the legal power to enact it.","A measure needs lawful authority as well as a policy rationale. Without an applicable emergency power or parliamentary authorization, an executive cannot simply take the legislature's assigned role.","Constitutions distribute powers to institutions, not just rights to individuals."),
q("The Unwritten Right","A country's constitution protects freedom of expression. Parliament passes a law banning criticism of elected officials, and the courts have authority to review legislation.",[["Constitutional text","Freedom of expression is protected."],["Statute","Criticism of elected officials is prohibited."]],"What is the court's central question?",["Whether the ban is politically popular.","Whether ministers sincerely believe the ban is useful.","Whether the statute is compatible with the constitutional protection.","Whether another country has adopted a similar ban."],2,"Compare the legislature's action to a higher-ranking legal rule.","The court must assess whether the statutory restriction can stand under the constitution's rights framework. Popularity or foreign practice cannot alone settle constitutional validity.","Judicial review is about legal consistency, not replacing elections."),
q("Two Governments, One Road","In a federation, the constitution assigns national railways exclusively to the federal government and local streets exclusively to provinces. A new law regulates only neighbourhood street parking.",[["Federal jurisdiction","National railways"],["Provincial jurisdiction","Local streets"]],"Which level has the clearest authority under the stated constitution?",["Federal government, because roads are infrastructure.","Provincial government, because the law concerns local streets.","Both governments must approve every parking ticket.","Neither, because transport cannot be legislated."],1,"The subject of the legislation matters more than its general theme.","The law concerns local streets, which the hypothetical constitution places within provincial jurisdiction. The broader label 'transport' does not displace that express assignment.","Real federal systems often resolve harder overlapping-jurisdiction questions in court."),
q("The Missing Hearing","A licensing agency can revoke a permit for misconduct but must first give the permit-holder an opportunity to respond. It revokes a permit without notifying the holder.",[["Agency power","Revoke permits for misconduct"],["Mandatory procedure","Opportunity to respond before revocation"]],"What is the clearest procedural defect?",["The agency lacks any authority over permits.","The person was denied the required opportunity to be heard.","Licences can only be revoked by popular vote.","Any revocation is unconstitutional even after a hearing."],1,"Authority to make a decision and the procedure for making it are different questions.","Even an agency acting within its substantive mandate must follow mandatory procedures. Failure to offer the stated hearing opportunity undermines procedural fairness.","A fair procedure does not guarantee a favourable outcome."),
q("The Later Statute","Two ordinary statutes enacted by the same legislature conflict. No constitutional rule or special priority clause applies. Statute A was passed in 2001; Statute B in 2024 and clearly covers the same issue.",[["Older rule","A permits the activity."],["Newer rule","B prohibits the same activity."]],"Which interpretive principle is most relevant?",["The newer inconsistent statute ordinarily governs to the extent of conflict.","Every older statute automatically overrides later legislation.","Both conflicting rules must be enforced simultaneously.","No law can be changed after it is enacted."],0,"Consider how one legislature changes its own earlier laws.","When equally authoritative statutes are irreconcilable, the later enactment generally prevails to the extent of the inconsistency. Courts first try to reconcile legislation where possible.","The Latin phrase lex posterior derogat legi priori captures this principle."),
q("The Highest Court","A trial judge faces a legal issue already decided in a binding decision of the highest court in the same jurisdiction. No relevant legal change has occurred.",[["Precedent","Higher court judgment directly governs the issue."],["New case","Relevant facts and legal rule match."]],"What should the trial judge ordinarily do?",["Follow the binding higher-court decision.","Choose whichever outcome is more popular.","Disregard precedent if the judge would have decided differently.","Refer every case to the legislature for a vote."],0,"Think about hierarchy within the judicial system.","Under vertical stare decisis, lower courts ordinarily apply binding legal rulings from higher courts in the same jurisdiction, even when they personally disagree.","Courts can distinguish precedents when materially relevant facts or law differ."),
q("A Trial by Headlines","A criminal defendant is presumed innocent. Public opinion polls show that 90% of respondents think the defendant committed the offence, but admissible evidence has not yet been assessed.",[["Criminal law","Prosecution bears the burden of proof."],["Public survey","90% believe the accusation."]],"Which statement follows?",["The poll proves guilt beyond reasonable doubt.","The defendant must prove innocence because the poll is decisive.","The prosecution still must establish guilt using admissible evidence.","Criminal burdens of proof are determined by newspaper circulation."],2,"A perception of guilt is not the same as legal proof.","The presumption of innocence and burden on the prosecution are not displaced by public opinion. A court determines guilt from the evidence and applicable standard of proof.","This is one reason courts limit prejudicial publicity around trials."),
q("The Treaty and the Statute","Assume a country's constitution requires a separate domestic statute before treaties can create enforceable rights in its courts. The government signs a treaty but passes no implementing statute.",[["Constitutional rule","Treaties require domestic implementing legislation."],["Government action","A treaty was signed; no statute was passed."]],"What follows in domestic court under the stated rule?",["Signature alone automatically makes every provision enforceable.","The treaty does not yet create the specified directly enforceable domestic rights.","The treaty becomes part of the constitution by default.","The domestic parliament loses its lawmaking powers."],1,"International commitment and domestic enforceability can be different.","The hypothetical system requires implementing legislation for domestic judicial enforcement. A state may incur international obligations while domestic courts still lack the needed legal instrument.","Countries vary substantially in how treaties interact with domestic law."),
q("An Unequal Rule","A hypothetical constitution says citizens in equivalent circumstances must receive equal legal treatment unless a difference is justified. A city charges one group double for the same permit solely because of their surname.",[["Constitutional rule","Equivalent cases need justified distinctions."],["Permit policy","Price turns entirely on surname."]],"What is the principal constitutional concern?",["The rule may be arbitrary unequal treatment without a justification.","All permit fees must be identical for every service.","A local government can never set permit prices.","Every difference between people is automatically illegal."],0,"Ask whether the distinction relates to a legitimate policy reason.","Charging differently based only on surnames has no stated connection to the permit service or legitimate purpose and is vulnerable under the specified equality requirement.","Equality rules often permit meaningful distinctions, such as discounts based on income."),
q("The Judicial Appointment","The constitution requires the head of state to appoint judges on the recommendation of an independent commission. The head of state makes an appointment without any recommendation.",[["Constitutional requirement","Commission recommendation is mandatory."],["Action","The head of state acted alone."]],"What is the best legal assessment?",["The appointment is unquestionably valid because heads of state are ceremonial.","The appointment is defective because a mandatory prerequisite was omitted.","Only parliament may appoint every judge in every system.","Recommendations are never legally significant."],1,"Look for the compulsory procedural condition.","The appointment procedure forms part of the distribution of constitutional authority. Omitting a mandatory recommendation makes the appointment legally vulnerable.","Appointment rules help buffer judicial selection from unilateral political control."),
q("The Closed Courtroom","A constitution guarantees public criminal trials but permits closed proceedings only when a judge makes specific findings of a serious safety risk. A prosecutor orders a trial closed to avoid embarrassing testimony.",[["Exception","Specific judicial findings of serious safety risk"],["Closure reason","Avoiding embarrassment to officials"]],"Which conclusion is strongest?",["The closure meets the stated exception automatically.","A prosecutor can replace the court's safety findings.","The closure lacks the specified basis and authorized decision-maker.","The public-trial guarantee excludes all criminal cases."],2,"Check both who may act and on what grounds.","The stated exception requires a judge's safety findings. A prosecutor's desire to avoid embarrassment provides neither the required decision-maker nor the required justification.","Open justice is often understood to protect public scrutiny of courts."),
q("A Rights Limitation","In a hypothetical rights charter, restrictions on assembly must pursue a legitimate goal and be no broader than necessary. A city prohibits all outdoor gatherings for a year to prevent traffic during one annual parade.",[["Legal test","Legitimate goal and necessary, tailored restriction"],["Policy","Year-long ban for a one-day traffic concern"]],"Where is the most obvious weakness?",["The objective of managing traffic can never be legitimate.","The restriction appears much broader than needed for the identified problem.","Constitutional rights always prohibit traffic rules.","Any law lasting one year is invalid by definition."],1,"Consider the relationship between the scale of the problem and the scale of the remedy.","A year-long ban on all gatherings seems poorly tailored to a one-day parade. Even a valid purpose does not automatically justify an excessively broad restriction.","Proportionality analyses often distinguish purpose, effectiveness, necessity, and overall balance.")

diplomacy: [
q("The Security Council Vote","The UN Security Council is voting on a substantive resolution. Fourteen members vote in favour, but one permanent member votes against.",[["Voting rule","Substantive decisions require no veto from a permanent member."],["Ballot","14 in favour; 1 permanent member against."]],"What happens to the resolution?",["It passes because a simple majority supported it.","It passes because only abstentions can block it.","It fails because a permanent member used its veto.","It is automatically sent to the International Court of Justice."],2,"The number of supporters is not the only condition for adoption.","For a substantive Security Council decision, a negative vote from a permanent member blocks adoption even when the other fourteen members support it.","The five permanent members are China, France, Russia, the United Kingdom, and the United States."),
q("The Consular Call","A traveller is arrested abroad and asks to contact their country's consulate. The receiving state is party to the Vienna Convention on Consular Relations, and no special exception applies.",[["Request","The arrested foreign national asks for consular contact."],["Convention","Consular communication and notification protections apply."]],"What is the best response by local authorities?",["Refuse all contact because foreign nationals have no consular rights.","Inform the traveller of the right and facilitate the requested consular communication.","Release the traveller immediately regardless of the alleged offence.","Ask the foreign embassy to conduct the criminal trial."],1,"Consular assistance is not a substitute for the local legal system.","The Convention establishes consular communication protections, including notification of consular officials when the detained person requests it. It does not itself confer immunity from prosecution.","Consulates can help detained nationals find legal assistance, but do not act as their judges."),
q("The Ambassador's Arrest","An accredited ambassador enjoys diplomatic immunity under the Vienna Convention on Diplomatic Relations. The host state suspects a crime and wants the diplomat removed without consent from the sending state.",[["Status","Accredited diplomatic agent"],["Host state's goal","End the person's diplomatic role in its territory"]],"Which measure is generally available?",["Declare the diplomat persona non grata.","Impose a criminal sentence in the host court without immunity waiver.","Confiscate all property of the sending state.","Cancel the sending state's UN membership."],0,"An unwelcome diplomat can be expelled without being criminally tried locally.","The receiving state may declare a diplomat persona non grata and require recall or termination of functions. Diplomatic immunity normally prevents local criminal prosecution absent a waiver.","Persona non grata is a Latin term meaning 'unwelcome person'."),
q("A Treaty Reservation","A state signs a multilateral treaty and proposes to exclude the effect of one provision. Assume the treaty permits reservations and the proposed reservation is compatible with its object and purpose.",[["Action","The state excludes a provision's legal effect for itself."],["Treaty framework","The stated reservation is permitted."]],"What is the action called?",["Accession","Reservation","Arbitration","Ratification"],1,"It concerns the scope of legal obligations, not the method of joining a treaty.","A reservation is a unilateral statement intended to exclude or modify a treaty provision's legal effect for the reserving state, where the relevant treaty law permits it.","Treaties can restrict or prohibit reservations, especially to core obligations."),
q("The Neutral Mediator","Two countries dispute a river border. Both agree to negotiations assisted by a third state, but they refuse to grant that third state power to issue a binding ruling.",[["Consent","Third state may help them negotiate."],["Limit","Third state has no power to impose an outcome."]],"Which process best matches the arrangement?",["Mediation","Binding arbitration","Adjudication by an international court","Annexation"],0,"Look at whether the outsider facilitates or decides.","Mediation helps parties negotiate toward a mutually accepted settlement. Arbitration or adjudication typically involves submission to a decision-making body with an agreed legal role.","Diplomatic settlements often depend on continuing consent, not simply legal victory."),
q("The International Court","State A wants the International Court of Justice to decide a legal dispute with State B. B has not consented to the Court's jurisdiction by treaty, declaration, or a case-specific agreement.",[["Court","International Court of Justice"],["Jurisdiction","No applicable consent from State B"]],"What is the primary obstacle?",["The ICJ never hears disputes between states.","The Court generally needs a jurisdictional basis founded on state consent.","The Court can hear only trade disputes.","State A must first win a vote in its own parliament."],1,"Distinguish a court's existence from its authority over particular parties.","In contentious cases, the ICJ generally requires a recognized basis of state consent to its jurisdiction. One state's wish to litigate does not alone establish authority over another.","ICJ advisory opinions follow a different procedure from contentious state-to-state cases."),
q("The Collective Defence Clause","An alliance treaty says that an attack on one member triggers a duty for each ally to take action it deems necessary, which may include armed force. A member is attacked.",[["Treaty wording","Each member chooses what action it deems necessary."],["Event","An armed attack on a member has occurred."]],"Which statement best reflects the treaty wording?",["Every member is automatically required to declare war.","Members have an obligation to respond, but the particular response is not automatically identical.","No member has any obligation to react.","The attacked state loses its independent government."],1,"Read the difference between a duty to act and a specified kind of action.","A clause requiring each ally to take the action it deems necessary creates a response obligation without mandating an identical military step by every ally.","NATO's Article 5 uses wording that allows allies to determine their necessary actions."),
q("The Sanctions Loophole","Several states agree to prohibit the export of specific components to Country X. One state continues to sell the same components through an intermediary that immediately forwards them to X.",[["Agreement","The components must not reach Country X through exports."],["Trade chain","Seller → intermediary → X"]],"What is the central compliance concern?",["The indirect route may circumvent the agreed export restriction.","An intermediary always makes any restricted export lawful.","Sanctions never regulate components.","Only goods shipped by aircraft can violate sanctions."],0,"Trace the final destination, not just the first invoice.","If the agreed restriction covers indirect exports or circumvention, routing controlled goods through an intermediary does not necessarily avoid the restriction.","Sanctions compliance often includes screening end users and beneficial ownership."),
q("The Recognition Dispute","A newly established authority controls a territory, but another state refuses to recognize it as a government. The authority claims recognition is obligatory whenever it wins a local election.",[["Claim","Election victory automatically compels recognition."],["Foreign policy","The other state has withheld recognition."]],"What is the most defensible response?",["Every election automatically creates an internationally recognized state.","Recognition is a political and legal act not mechanically compelled by any election.","Recognition can happen only by UN Security Council vote.","A territory without recognition cannot contain a population."],1,"Distinguish domestic elections from external relations between states.","Recognition of states or governments involves legal and diplomatic considerations; winning an election does not automatically require every other country to extend recognition.","There is no single worldwide procedure that all countries use to recognize governments."),
q("The Transit Passage","Two states sign an agreement granting each other's commercial vessels access through a designated waterway. A later dispute arises, but the treaty has no suspension clause and neither party invokes a recognized legal basis to suspend it.",[["Agreement","Reciprocal commercial access"],["Dispute","Political relations deteriorate without a suspension basis."]],"Which position is most defensible?",["Political disagreement automatically cancels every treaty.","The agreed obligations ordinarily remain binding pending a lawful change.","A treaty ceases to exist whenever a minister changes.","Domestic television coverage decides treaty validity."],1,"What is the default legal status of a valid agreement?",
"An agreement continues to bind parties unless it is lawfully terminated, modified, or suspended. An unrelated diplomatic dispute does not itself erase treaty duties.","The phrase pacta sunt servanda expresses the principle that agreements must be kept."),
q("The Observer Mission","A multilateral organization offers to monitor a ceasefire. Both parties consent to observers who can report violations but cannot force compliance.",[["Mandate","Observe and report"],["Authority","No enforcement power"]],"What is the mission's primary function?",["Impose criminal penalties on commanders.","Document and report whether the agreed ceasefire is being observed.","Replace the government in both countries.","Rewrite borders without the parties' consent."],1,"Look at what the mandate authorizes, rather than what a stronger mission might do.","A monitoring mission with observation and reporting powers gathers and communicates evidence. Enforcement or boundary revision would require further legal authority.","Independent observation can reduce disputes about what happened, even without coercive powers."),
q("The Diplomatic Note","Country A sends Country B a formal diplomatic note protesting a border incident. B treats the note as an automatic declaration of war.",[["Message","A formal written protest"],["No announcement","No declaration of war or use of force"]],"Which assessment is best?",["A protest note is not, by itself, a declaration of war.","Every formal diplomatic note declares war.","Diplomatic notes are always legally meaningless.","A protest obligates the UN to expel both countries."],0,"Not all official messages change the legal state of relations in the same way.","A diplomatic protest communicates a government's objection and may preserve its legal position; it does not automatically initiate hostilities or constitute a declaration of war.","Diplomatic notes can serve as formal records of positions in later disputes.")

geography: [
q("The Oil Chokepoint","A shipping firm transports oil from the Persian Gulf to the Indian Ocean. The captain needs the narrow outlet between Iran and Oman.",[["Origin","Persian Gulf"],["Destination","Gulf of Oman and Arabian Sea"]],"Which waterway should the briefing identify?",["Strait of Hormuz","Strait of Gibraltar","Dardanelles","Strait of Malacca"],0,"Focus on the exit from the Persian Gulf itself.","The Strait of Hormuz links the Persian Gulf with the Gulf of Oman and the Arabian Sea. The other straits connect different bodies of water.","It is one of the world's most strategically consequential maritime chokepoints.",{lat:26.6,lon:56.5,region:"Arabian Peninsula",width:150}),
q("The Two-Ocean Shortcut","A ship must travel from the Atlantic coast of Central America to the Pacific without rounding South America. Its route passes through an artificial canal.",[["Start","Caribbean side of Central America"],["End","Pacific side of Central America"]],"Which canal provides the connection?",["Suez Canal","Panama Canal","Kiel Canal","Corinth Canal"],1,"The required canal crosses an isthmus, rather than a continent.","The Panama Canal crosses the Isthmus of Panama and connects the Atlantic and Pacific ocean systems. Suez links the Mediterranean and Red seas.","Ships use locks to navigate the Panama Canal's elevation differences.",{lat:9.1,lon:-79.7,region:"Central America",width:175}),
q("The Mediterranean Exit","A commercial ship sails from the Mediterranean Sea into the Atlantic Ocean without travelling through a canal. Which narrow passage will it use?",[["Origin","Mediterranean Sea"],["Destination","Atlantic Ocean"]],"Identify the passage.",["Strait of Gibraltar","Strait of Hormuz","Bering Strait","Bab el-Mandeb"],0,"Look between southern Europe and northern Africa.","The Strait of Gibraltar lies between Spain and Morocco and is the natural connection between the Mediterranean and the Atlantic.","At its narrowest, the strait is only about 14 kilometres wide.",{lat:36,lon:-5.6,region:"Western Mediterranean",width:150}),
q("The Eastern Gate","A tanker has just transited the Suez Canal into the Red Sea and is heading toward the Gulf of Aden. It must pass between Yemen and the Horn of Africa.",[["Northern point","Red Sea"],["Southern point","Gulf of Aden"]],"Which chokepoint comes next?",["Bosporus","Strait of Magellan","Bab el-Mandeb","Strait of Dover"],2,"The passage is at the southern entrance to the Red Sea.","Bab el-Mandeb connects the Red Sea and the Gulf of Aden between the Arabian Peninsula and the Horn of Africa.","Disruptions near this passage can affect traffic bound for the Suez Canal.",{lat:12.6,lon:43.3,region:"Southern Red Sea",width:160}),
q("Europe Meets Asia","A vessel travels from the Black Sea toward the Sea of Marmara through a narrow strait that passes through Istanbul.",[["From","Black Sea"],["To","Sea of Marmara"]],"Which strait is it crossing?",["Bosporus","Dardanelles","Strait of Messina","English Channel"],0,"Think about which of Turkey's two famous straits touches the Black Sea.","The Bosporus connects the Black Sea to the Sea of Marmara. The Dardanelles connects the Sea of Marmara to the Aegean Sea.","The Bosporus runs through Istanbul, a city spanning two continents.",{lat:41.1,lon:29.1,region:"Northwestern Türkiye",width:130}),
q("The Rain Shadow","Moist air moves from a Pacific coast up a north-south mountain range. It cools and loses much of its moisture on the windward side before descending eastward.",[["Wind","From the Pacific toward the mountains"],["Effect","Air descends and warms beyond the crest"]],"Which side is more likely to be dry?",["Windward western slope","Leeward eastern slope","Both sides always receive equal precipitation","Only the highest summit"],1,"Follow what happens after the air has already released much of its moisture.","Descending leeward air warms, lowering relative humidity and often producing a dry rain shadow. The windward side tends to receive more orographic precipitation.","The Andes contribute to major climate contrasts in South America.",{lat:-28,lon:-70.5,region:"Central Andes",width:200}),
q("A Landlocked Exporter","A landlocked country wants to ship machinery to an overseas buyer. It has no territorial access to any ocean but has a rail agreement with a coastal neighbour.",[["Geography","No coastline"],["Infrastructure","Rail line reaches a foreign seaport"]],"Which route is geographically possible?",["Use a seaport in the neighbouring country under the transit agreement.","Sail directly from an inland capital to the ocean on the open sea.","Avoid crossing any international border to reach an ocean port.","Export by sea without using a port or connecting waterway."],0,"A lack of coastline is different from a lack of access through neighbours.","Landlocked states can move cargo overland to ports in other countries using transit agreements. They cannot reach a sea port solely across their own territory.","Many landlocked countries depend on cross-border transport corridors."),
q("The Upstream Reservoir","Country A builds a dam upstream from Country B on a river that crosses their border. A drought reduces water availability, and A retains more water in its reservoir.",[["River direction","A → B"],["Action","A retains more upstream water"]],"Which immediate geographic consequence is most plausible?",["Less water may reach downstream Country B.","More water must reach B because it is downstream.","The river automatically reverses direction.","The international boundary moves with the reservoir level."],0,"Track the direction of flow and the water retained before it crosses the border.","Water stored upstream may reduce downstream flow, especially during a drought. The precise amount depends on releases, tributaries, and other conditions.","Shared rivers require coordination because decisions made upstream affect downstream users."),
q("The Meridian Puzzle","Two cities lie near the same latitude, but City A is at 15°E and City B is at 45°E. Assume standard solar time and ignore legal time-zone boundaries.",[["City A","15° east longitude"],["City B","45° east longitude"]],"How does local solar noon compare?",["B reaches solar noon about two hours before A.","B reaches solar noon about two hours after A.","They reach solar noon together because their latitudes match.","Their solar noons are twelve hours apart."],0,"Earth rotates 360 degrees in roughly 24 hours.","A 30-degree eastward longitude difference corresponds to about two hours of solar time. Eastern locations encounter the Sun's noon position earlier.","Political time zones can differ considerably from local solar time."),
q("A Northern Route","A ship sails from the North Atlantic toward the Baltic Sea. It must pass through the waterway between Denmark and Sweden linking the Kattegat and the Baltic area.",[["Route","Kattegat toward Baltic Sea"],["Narrow passage","Between Zealand and southern Sweden"]],"Which passage fits?",["Øresund","Strait of Gibraltar","Strait of Hormuz","Bering Strait"],0,"Focus on the sea approaches to Scandinavia.","Øresund (the Sound) separates Denmark's island of Zealand from Sweden and forms an important Baltic approach.","The Øresund Bridge connects Copenhagen and Malmö.",{lat:55.7,lon:12.8,region:"Scandinavia",width:140}),
q("An Ocean Boundary","A fisheries dispute concerns the line exactly 200 nautical miles offshore. Both sides assume a normal baseline and no overlapping maritime claims. What zone are they discussing?",[["Distance","200 nautical miles from the baseline"],["Subject","Resource rights at sea"]],"Which maritime zone is most directly implicated?",["Exclusive economic zone","Territorial sea of 12 nautical miles","Contiguous zone of 24 nautical miles","Airspace above the inland capital"],0,"Think about coastal resource rights beyond the territorial sea.","The exclusive economic zone can extend up to 200 nautical miles from the baseline under the law of the sea, subject to relevant geographic and legal limitations.","EEZ resource rights are not identical to complete territorial sovereignty."),
q("The Canal Detour","A ship goes from the Mediterranean to the Indian Ocean through the Red Sea. If the Suez Canal is unavailable, which sea route around Africa is the classic alternative?",[["Origin","Mediterranean region"],["Destination","Indian Ocean"],["Constraint","Suez Canal closed"]],"Which landmark does the detour round?",["Cape of Good Hope","Cape Horn","Cape Cod","Cape Hatteras"],0,"The alternate route goes south around Africa, not around the Americas.","Rounding the Cape of Good Hope takes ships around southern Africa to reach the Indian Ocean without using Suez.","Major shipping disruptions can make this much longer route economically worthwhile.",{lat:-34.4,lon:18.5,region:"Southern Africa",width:160})

economics: [
q("The Currency Shock","Your country imports most of its oil, priced internationally in US dollars. Its currency depreciates by 15% against the dollar while the dollar price of oil stays constant.",[["Exchange rate","Domestic currency loses value against USD"],["Oil price","Unchanged in dollars"]],"Which effect is most likely in the short run?",["The local-currency import cost of oil rises.","The local-currency import cost of oil falls.","The world dollar price of oil must rise.","Oil imports become free of exchange-rate risk."],0,"Consider how many units of local currency are now needed to buy one dollar.","A weaker domestic currency means more local currency is needed for the same dollar-priced oil shipment. That raises the local-currency cost, all else equal.","Imported inflation can occur even when the foreign-currency price of a good is stable."),
q("The Price Ceiling","A city legally caps apartment rent below the market-clearing rent in a simple competitive model. The supply curve slopes up and the demand curve slopes down.",[["Policy","Binding maximum price below equilibrium"],["Market","Demand exceeds supply at the capped price"]],"Which immediate outcome does the model predict?",["A shortage of rental units at the controlled price.","A guaranteed housing surplus.","No change to quantity demanded or supplied.","All landlords automatically build more apartments."],0,"Compare quantities demanded and supplied at the capped price.","Below-equilibrium price ceilings tend to produce excess demand: more people want units than owners offer at that price, creating a shortage in the stylized model.","Actual housing outcomes also depend on exemptions, construction incentives and market conditions."),
q("The Two Workshops","Workshop A can make 12 tables or 6 chairs per day. Workshop B can make 8 tables or 8 chairs. Both have constant trade-offs and can exchange goods.",[["Workshop A","12 tables or 6 chairs"],["Workshop B","8 tables or 8 chairs"]],"Who has the comparative advantage in making chairs?",["Workshop A","Workshop B","Neither; their opportunity costs are identical.","It cannot be determined from production possibilities."],1,"Compare how many tables each workshop gives up to make one chair.","A sacrifices 2 tables per chair; B sacrifices 1 table per chair. B has the lower opportunity cost and therefore the comparative advantage in chairs.","Comparative advantage depends on opportunity cost, not simply which workshop makes the most of everything."),
q("The Bond Market","A fixed-coupon government bond pays $50 each year. Its market price drops from $1,000 to $800 while the annual coupon stays fixed.",[["Annual coupon","$50"],["Price movement","$1,000 → $800"]],"What happens to the bond's current yield?",["It rises from 5% to 6.25%.","It falls from 6.25% to 5%.","It remains at 5%.","It becomes negative."],0,"Current yield relates annual coupon income to market price.","At $1,000, $50/$1,000 = 5%. At $800, $50/$800 = 6.25%. A bond's current yield moves inversely to its price when the coupon is unchanged.","Current yield is not the same as yield to maturity, which also includes price changes through redemption."),
q("The Tariff Brief","A country introduces an import tariff on otherwise identical foreign goods. Assume normal upward domestic supply and downward domestic demand, and no retaliation.",[["Policy","Tax on imported goods"],["Market model","Competitive domestic market"]],"Which group most directly faces pressure from a higher domestic price?",["Domestic consumers purchasing the affected goods.","Only unrelated foreign tourists.","Nobody, because the tariff cannot change prices.","All consumers automatically receive an equal cash rebate."],0,"A tax on imports changes the cost of obtaining imported products.","Import tariffs commonly raise the domestic price of covered goods, hurting buyers while potentially helping competing domestic producers. The exact effects depend on market details.","A tariff's legal payer and its ultimate economic burden need not be the same actor."),
q("The Central Bank","An economy faces inflation well above its target. The central bank raises its policy interest rate; assume conventional transmission and no major offsetting shocks.",[["Goal","Reduce inflationary demand pressure"],["Policy","Higher short-term interest rates"]],"Which channel is most consistent with the policy?",["Borrowing tends to become costlier, moderating spending and investment.","Borrowing automatically becomes free.","Every asset price must increase immediately.","The government must eliminate all taxes."],0,"Think about the cost of financing consumption and investment.","Higher policy rates generally raise financing costs and restrain interest-sensitive spending, which can reduce demand pressure on prices over time.","Monetary policy can operate with substantial lags and does not directly set every consumer price."),
q("The Factory's Smoke","A factory releases pollution that harms nearby households. The factory and households do not trade compensation, and the pollution cost is absent from the factory's private production decisions.",[["Private cost","Excludes health and property damage"],["Public effect","Nearby households bear additional costs"]],"What problem best describes the situation?",["A negative externality","A positive network effect","A perfectly internalized cost","A purely private benefit with no spillover"],0,"Ask whether a production decision imposes costs on people outside the transaction.","Pollution imposes an uncompensated cost on third parties, so the social cost can exceed the firm's private cost. That is a negative externality.","Pigouvian taxes aim to make decision-makers account for external costs."),
q("Nominal Versus Real","A worker's nominal salary rises by 4% over a year while the price level rises by 6%. Assume these rates measure comparable periods.",[["Nominal wage growth","+4%"],["Inflation","+6%"]],"What happens to the worker's purchasing power?",["It increases by about 2%.","It decreases by about 2%.","It remains exactly unchanged.","It increases by 10%."],1,"Compare salary growth to price growth rather than adding them.","Real income changes by roughly 4% − 6% = −2%. More precisely, 1.04/1.06 − 1 ≈ −1.89%, so purchasing power falls.","Nominal pay increases can coexist with declining real living standards."),
q("A Budget Deficit","A government receives $90 billion in revenue and spends $105 billion over the same fiscal year. Ignore financing costs outside these totals.",[["Revenue","$90 billion"],["Expenditure","$105 billion"]],"Which fiscal result follows?",["A $15 billion deficit","A $15 billion surplus","A balanced budget","A $195 billion deficit"],0,"Compare expenditure with revenue in the same period.","The deficit is $105 billion − $90 billion = $15 billion. A deficit describes the year's shortfall, not the total stock of public debt.","Government debt can rise due to repeated deficits and other financing adjustments."),
q("The Supply Shock","A severe frost destroys part of a country's coffee crop. Demand for coffee remains unchanged, and the market is competitive.",[["Supply","Shifts left"],["Demand","Unchanged"]],"Which price-and-quantity response is predicted by the basic model?",["Higher price, lower quantity","Lower price, higher quantity","Higher price, higher quantity","Lower price, lower quantity"],0,"Identify how the equilibrium changes when sellers have less to offer.","A leftward shift of the supply curve with unchanged demand raises the equilibrium price and reduces the quantity traded.","Bad harvests can cause food-price inflation even without a rise in consumer demand."),
q("The Sunk Cost","A city has spent $8 million on an incomplete project. Finishing costs another $5 million and would create only $3 million in additional benefits. Canceling costs nothing more, and the sunk $8 million cannot be recovered.",[["Remaining cost","$5 million"],["Additional benefit","$3 million"]],"Under a narrow cost-benefit calculation, what is the rational next step?",["Finish because $8 million has already been spent.","Cancel because the remaining costs exceed remaining benefits.","Finish because all projects create equal value.","Spend another $8 million before deciding."],1,"A past, unrecoverable expense is not changed by today's choice.","The relevant incremental comparison is $3 million in future benefits versus $5 million in remaining costs. The historical $8 million is sunk and should not drive the choice.","The 'sunk-cost fallacy' also appears in everyday choices like finishing a bad movie."),
q("The Tax Incidence","A market has extremely inelastic demand but relatively elastic supply. A per-unit tax is imposed on sellers, and the market remains competitive.",[["Demand","Buyers barely change quantity in response to price"],["Supply","Sellers respond more strongly to price"]],"Who is likely to bear more of the economic burden?",["Buyers","Sellers","Exactly half each in every market","Only the tax authority"],0,"The less responsive side of a market generally has fewer ways to avoid the tax.","With demand much less elastic than supply, buyers generally bear most of a tax through higher prices, regardless of which side formally remits it.","Statutory tax incidence and economic tax incidence are different concepts.")
],
government: [
q("The Confidence Vote","A parliamentary system requires the prime minister's government to maintain the elected chamber's confidence. The chamber passes an explicit no-confidence motion, and the constitution provides resignation or an election as the available routes.",[["Vote","No confidence passed"],["Constitution","Government must retain lower-house confidence"]],"What must happen next under these rules?",["The cabinet continues indefinitely as if nothing happened.","The government must take one of the constitutionally available routes: resignation or an election.","Every member of parliament loses citizenship.","The opposition leader automatically becomes a hereditary monarch."],1,"Focus on the condition required for the government to remain in office.","The governing cabinet has lost a required basis of parliamentary legitimacy and must follow the system's constitutional process, such as resigning or seeking a dissolution.","A confidence vote differs from an ordinary policy vote because it can determine whether a government survives."),
q("The Seat Bonus","In a first-past-the-post electoral district, Candidate A receives 38%, B receives 35%, and C receives 27%. One seat is awarded to the candidate with the most votes.",[["A","38%"],["B","35%"],["C","27%"]],"Who wins the seat?",["Candidate A","Candidate B","Candidates A and B split it.","Nobody, because no one received 50%."],0,"A plurality is not necessarily a majority.","First-past-the-post awards the seat to the candidate with the most votes. A's 38% is a plurality, even though 62% voted for other candidates.","Seat shares under single-member plurality rules can differ greatly from national vote shares."),
q("The Threshold","A legislature allocates seats proportionally among parties receiving at least 5% of the national vote. A party receives 4.8%, and there are no district-seat exceptions.",[["Electoral rule","Minimum 5% to enter seat allocation"],["Party result","4.8%"]],"What is the party's outcome under the stated system?",["It is excluded from proportional seat allocation.","It automatically receives exactly 4.8% of seats.","It gains a bonus seat for coming close.","It controls the upper chamber."],0,"The threshold is a condition for participating in allocation.","A vote share below a strict 5% eligibility threshold does not qualify the party for proportional seat allocation under the stated rules.","Electoral thresholds can reduce fragmentation while leaving some voters without representation."),
q("A Fragile Majority","A 100-seat chamber requires more than half its seats for a majority. Party A has 44, B has 32, C has 18 and D has 6.",[["Seat totals","A 44 · B 32 · C 18 · D 6"],["Majority","At least 51 seats"]],"Which two-party coalition would have a majority?",["A + D","B + C","A + C","C + D"],2,"Add the partners' seats and compare with the majority threshold.","A + C holds 44 + 18 = 62 seats. A + D has 50; B + C has 50; C + D has 24. Only A + C clears 50.","Coalition arithmetic is a central part of politics in many parliamentary democracies."),
q("The Two Chambers","A bill must pass both chambers in identical text before being sent to the head of state. The lower house approves an amended version; the upper house has approved only the original version.",[["Procedure","Both chambers must approve identical text"],["Votes","Lower: amended · Upper: original"]],"What is still required?",["The chambers must reconcile and approve the same text.","The bill is law because each chamber voted on some version.","The bill can never be amended in any legislature.","A court must write the final bill text itself."],0,"The requirement concerns agreement on the same legislative language.","Separate approval of different versions does not satisfy a bicameral identical-text requirement. The bill needs a process that produces common approved text.","Legislatures often use further amendments or conference-style procedures to resolve differences."),
q("The Royal Assent","In a constitutional monarchy, a bill has passed the elected legislature but has not received the formal royal assent required by the constitution.",[["Legislative vote","Completed"],["Enactment requirement","Royal assent still pending"]],"What is the most precise conclusion?",["The bill has completed every required step.","The constitutionally required enactment process remains incomplete.","The courts must now hold a referendum.","The elected legislature is automatically dissolved."],1,"Distinguish parliamentary approval from formal enactment.","If the constitution makes royal assent a necessary step, a bill that lacks assent has not completed the process to become law.","In modern parliamentary monarchies the assent is usually a formal constitutional step."),
q("The Oversight Hearing","A parliamentary committee requests financial records from a department under a rule authorizing legislative oversight. The minister claims oversight committees can only debate bills.",[["Committee mandate","Includes scrutiny of departmental spending"],["Request","Financial records linked to spending"]],"What best explains the committee's role?",["Oversight can include questioning and investigating executive administration.","Committees may review only proposed legislation, never spending.","The committee becomes the executive branch when it requests information.","Oversight requires the committee to convict a minister of a crime."],0,"Legislatures do more than pass new statutes.","Legislative oversight can involve examining spending, questioning officials and investigating how the executive implements law. It is not limited to bill drafting.","The power to scrutinize spending is a major tool of democratic accountability."),
q("The Quorum Problem","A council has 21 members. Its rules say at least 11 must be present to conduct business. Only 10 attend a meeting where all present support a motion.",[["Rule","Quorum: 11"],["Attendance","10 members"]],"What is the central problem with passing the motion?",["The motion lacks the required quorum.","The vote is valid because everyone present agrees.","The quorum can be ignored whenever a motion is popular.","The council must have exactly 21 people present."],0,"A majority of those present is not the same as having enough people present.","Because only ten members are present, the meeting lacks its minimum quorum of eleven. Unanimity among the ten cannot repair the missing prerequisite.","Quorum rules prevent small groups from taking decisions on behalf of much larger bodies."),
q("The President's Veto","A hypothetical presidential constitution permits the legislature to override a veto only with two-thirds of the entire 90-member chamber. A vetoed bill receives 59 votes to override.",[["Required votes","Two-thirds of 90"],["Actual votes","59"]],"Does the override succeed?",["Yes, because 59 is over half of 90.","No, because 60 votes are needed.","Yes, because 59 is more than two-thirds of 80.","No, because all 90 members must agree."],1,"Calculate the required supermajority using the full chamber's membership.","Two-thirds of 90 is 60. With only 59 votes, the chamber misses the stated threshold by one, so the veto stands.","Constitutional supermajorities are often designed to require wider agreement than ordinary laws."),
q("The Civil Service","A government hires permanent tax administrators through competitive examinations. A new minister wants to replace every administrator with a campaign volunteer, despite a law requiring merit-based appointments.",[["Public-service statute","Merit-based hiring required"],["Ministerial plan","Replace staff on partisan loyalty alone"]],"Which principle is most directly threatened?",["A politically neutral, merit-based civil service","The right of ministers to disregard every statute","A ban on holding elections","The legal independence of private companies"],0,"Focus on the hiring criterion established by law.","Replacing permanent administrators solely for partisan loyalty would conflict with the specified merit requirement and undermine a professional, politically neutral civil service.","Civil-service institutions are meant to preserve administrative continuity across changes of government."),
q("A Federal Amendment","A country's constitution requires approval by the national legislature plus seven provincial assemblies to change the division of powers. The national legislature approves, but only six provinces agree.",[["Amendment rule","National legislature + seven provinces"],["Result","National legislature + six provinces"]],"Has the amendment passed?",["Yes, because the national legislature is the most powerful body.","No, the required provincial threshold has not been met.","Yes, if the prime minister announces it on television.","No, because constitutions can never be amended."],1,"All independently required approvals must be satisfied.","The rule expressly requires seven provincial approvals, and only six are present. The national legislature's approval alone cannot satisfy that missing condition.","Federal amendment procedures often protect regional interests as well as national majorities."),
q("The Speaker's Role","A legislature's standing orders direct the speaker to apply agreed debate rules impartially. The speaker cuts off one party's speeches solely because they criticize the cabinet.",[["Standing order","Apply debate rules impartially"],["Speaker's conduct","One party silenced for political criticism"]],"Which institutional norm is most clearly breached?",["Impartial management of legislative proceedings","The rule against ordinary committee meetings","An obligation to support every government policy","The requirement to abolish opposition parties"],0,"A presiding officer's procedural role differs from a partisan policy preference.","Silencing one party solely for criticism violates the stated duty to administer debate rules impartially. It undermines the fair functioning of the chamber.","Legislative speakers often have specific rules and traditions for managing debate and order.")
],
wildcard: [
q("Three Capitals","An intelligence note lists one country's executive capital as Pretoria, legislative capital as Cape Town, and judicial capital as Bloemfontein.",[["Executive","Pretoria"],["Legislative","Cape Town"],["Judicial","Bloemfontein"]],"Which country is described?",["South Africa","Namibia","Botswana","Zimbabwe"],0,"Look for the unusually distributed set of capital functions.","South Africa is known for distributing its main capital functions across Pretoria, Cape Town and Bloemfontein.","The Constitutional Court sits in Johannesburg, a nuance to the traditional description of Bloemfontein as the judicial capital."),
q("The Nobel Exception","A researcher notes that most Nobel Prizes are presented in Sweden, but one is awarded at a ceremony in Oslo.",[["Ceremony city","Oslo"],["Award","One of the original Nobel categories"]],"Which prize is awarded in Oslo?",["Nobel Prize in Physics","Nobel Peace Prize","Nobel Prize in Chemistry","Nobel Prize in Literature"],1,"The location follows Alfred Nobel's original instructions.","The Nobel Peace Prize is awarded in Oslo, Norway. The other original Nobel prizes are presented in Stockholm, Sweden.","Norway and Sweden were united under one monarch when Nobel wrote his will."),
q("A Kingdom's Island","An autonomous territory is geographically part of North America but belongs to the Kingdom of Denmark. It is also the world's largest island other than Australia, generally classified as a continent.",[["Geography","Northeastern North America"],["Political association","Kingdom of Denmark"]],"Which territory fits?",["Iceland","Greenland","Faroe Islands","Svalbard"],1,"Separate an island's continental geography from its political association.","Greenland is geographically associated with North America and is an autonomous territory within the Kingdom of Denmark.","Greenland's enormous ice sheet is central to discussions of sea-level rise."),
q("The Timekeeping Line","A shipping company schedules two ports at the same UTC instant. Port A is UTC+8, and Port B is UTC−5. Ignore daylight-saving changes.",[["UTC time","12:00"],["Local offsets","A +8 · B −5"]],"What are the two local clock times?",["A 20:00; B 07:00","A 04:00; B 17:00","A 20:00; B 17:00","A 08:00; B 05:00"],0,"Apply each offset to the same UTC reference time independently.","12:00 + 8 hours = 20:00 in A, while 12:00 − 5 hours = 07:00 in B. The local clocks differ by 13 hours.","Time-zone offsets can even include 30- and 45-minute increments."),
q("The Treaty of 1494","Two European maritime powers signed the 1494 Treaty of Tordesillas, dividing claims in lands outside Europe along a demarcation line.",[["Date","1494"],["Signatories","Two Iberian kingdoms"]],"Which pair made the agreement?",["Spain and Portugal","England and France","Venice and Genoa","Sweden and Denmark"],0,"Focus on Atlantic exploration during the late fifteenth century.","Spain and Portugal agreed to the Treaty of Tordesillas, which attempted to divide their overseas claims along a meridian.","The arrangement was made without the consent of the Indigenous peoples whose lands were claimed."),
q("The Invisible Longitude","A navigation team wants the conventional reference for measuring longitudes east or west. Its chart uses a zero-degree meridian passing through London.",[["Coordinate","0° longitude"],["Historic landmark","Royal Observatory, London"]],"What is that line conventionally called?",["Equator","Prime meridian","International Date Line","Tropic of Cancer"],1,"Latitude and longitude use different geographic reference lines.","The prime meridian is the conventional zero-longitude reference, historically associated with Greenwich in London.","The IERS reference meridian used by modern satellite systems lies slightly east of the historic Greenwich line."),
q("The Caspian Classification","An analyst finds an enormous inland body of water bordered by Russia, Kazakhstan, Turkmenistan, Iran and Azerbaijan.",[["Neighbours","Five states"],["Drainage","Enclosed inland basin"]],"Which body of water is it?",["Black Sea","Caspian Sea","Aral Sea","Lake Baikal"],1,"Look for the enclosed basin that borders both Eastern Europe and Central Asia.","The Caspian Sea is the world's largest enclosed inland body of water by surface area and borders the five listed states.","Its name includes 'sea' even though it has no natural connection to the world ocean."),
q("The Atomic Clock","A metrology briefing says the SI second is defined using a specific transition frequency of an atom rather than Earth's rotation.",[["Field","Atomic timekeeping"],["Measurement","Definition of the SI second"]],"Which element provides the reference transition?",["Rubidium","Hydrogen","Caesium","Strontium"],2,"The official SI definition has retained one traditional microwave atomic reference.","The SI second is defined using the unperturbed ground-state hyperfine transition frequency of caesium-133.","Optical clocks may achieve extraordinary precision but do not currently replace the formal caesium definition."),
q("The Scientific Index","A lab gives a solution a pH of 3 and another a pH of 5. Assume ideal conditions for simple pH comparison.",[["Solution A","pH 3"],["Solution B","pH 5"]],"How do their hydrogen-ion activities compare?",["A is about twice B.","A is about 100 times B.","B is about 100 times A.","They are equal because both are acidic."],1,"The pH scale is logarithmic rather than linear.","A difference of two pH units represents a factor of 10² = 100 in hydrogen-ion activity, so the pH 3 solution has roughly 100 times that of pH 5.","A logarithmic scale compresses quantities that span many orders of magnitude."),
q("A Polar Agreement","A country plans to establish military weapons-testing facilities on Antarctica. Other countries point to the Antarctic Treaty.",[["Treaty principle","Antarctica reserved for peaceful purposes"],["Proposed action","Military weapons testing"]],"What is the strongest treaty-based objection?",["The treaty prohibits military measures such as weapons testing.","The treaty requires all countries to own equal shares of Antarctica.","The treaty permits any military operation without restriction.","The treaty requires every research station to shut down."],0,"The agreement distinguishes peaceful scientific work from military measures.","Article I of the Antarctic Treaty prohibits military measures, including weapons tests, while permitting military personnel or equipment for scientific or other peaceful purposes.","The treaty entered into force in 1961 and is part of a broader Antarctic governance system."),
q("The Calendar Correction","A historical record shows that 1900 was not a leap year in the Gregorian calendar, even though it is divisible by four.",[["Year","1900"],["Calendar","Gregorian"]],"Which rule explains why?",["Years ending in 00 are never leap years.","Century years must be divisible by 400 to be leap years.","Leap years occur only once every ten years.","Years divisible by four are always leap years."],1,"The Gregorian calendar includes an extra condition for century years.","Century years are leap years only when divisible by 400. Thus 1900 was not a leap year, while 2000 was.","The Gregorian reform improved the calendar's long-term alignment with the solar year."),
q("A Philosophical Distinction","A briefing compares the freedom to act without external interference with the ability to govern one's own choices. Political philosophers often distinguish these two senses of liberty.",[["Idea A","Absence of external interference"],["Idea B","Self-mastery or self-direction"]],"Which pairing best matches Isaiah Berlin's terminology?",["A positive liberty; B negative liberty","A negative liberty; B positive liberty","Both are strictly positive liberty","Neither relates to liberty"],1,"Think about whether a definition emphasizes obstacles from others or control over oneself.","Berlin characterizes negative liberty in terms of the area free from interference, and positive liberty in terms of self-direction or mastery.","Berlin's 1958 lecture 'Two Concepts of Liberty' became a landmark in political philosophy.")
],
final: [
q("The Strait and the Shortage","A small country imports energy through a single narrow strait. Shipping insurance costs rise after maritime attacks. At the same time, its currency weakens against the US dollar. The fuel is invoiced in dollars.",[["Geography","Imports depend on a disrupted maritime chokepoint."],["Economics","Higher shipping costs and a weaker local currency."]],"Which cabinet assessment is most defensible?",["Domestic energy costs face upward pressure from two separate channels.","A weaker currency must offset higher shipping costs.","The strait disruption guarantees that domestic energy demand rises.","The shipping route becomes irrelevant once invoices are in dollars."],0,"Identify each cost channel separately before combining them.","Disruption raises transport and insurance costs, while currency depreciation raises the local-currency cost of dollar-priced imports. Both can push domestic energy costs higher.","Geographic bottlenecks and exchange rates can reinforce each other during supply crises."),
q("The Emergency Budget","A parliament has exclusive power to enact taxes. An economic recession begins, and the prime minister wants to impose a new tax by announcement. No emergency taxing power exists in this hypothetical constitution.",[["Economic situation","Recession and falling revenue"],["Constitutional allocation","Taxation requires an act of parliament"]],"Which cabinet advice is soundest?",["Raise the tax by announcement because recessions suspend the constitution.","Seek parliamentary legislation for any new tax.","Instruct the central bank to enact the tax directly.","Ask an international organization to collect domestic taxes without authority."],1,"A policy may be urgent without giving the executive a new constitutional power.","The recession creates fiscal pressure but does not create taxing authority under the stated constitutional rules. Parliamentary legislation is required.","Fiscal policy and constitutional process constrain one another during emergencies."),
q("The Border Railway","Two countries share a railway crossing that is vital to a landlocked state's exports. A newly elected minister threatens to close the crossing, despite a binding transit treaty and no lawful suspension basis.",[["Geography","Railway gives landlocked state access to a seaport."],["Law","Transit treaty remains in force."]],"Which recommendation best addresses both risks?",["Close the route immediately; a new minister voids older treaties.","Keep the treaty obligations in view and negotiate any proposed changes lawfully.","Declare that landlocked states cannot trade internationally.","Treat an election result as an automatic change to international borders."],1,"Consider both economic dependence and continuing legal obligations.","A transit corridor matters economically, and an election does not itself cancel treaty obligations. Lawful negotiation is the sound response if a government wants changes.","For landlocked economies, diplomatic stability can be as important as road quality."),
q("The Fiscal Coalition","A 120-seat parliament requires 61 votes for a budget. The governing party has 55 seats and an ally has 7. The ally will support the budget only if a proposed tariff is removed. The constitution permits ordinary coalition bargains.",[["Seats","Government 55 · Ally 7"],["Condition","Ally supplies votes only if tariff removed"]],"What is the most direct route to passage?",["Retain the tariff and expect 55 votes to be a majority.","Remove the tariff and obtain the ally's support for 62 votes.","Dissolve the legislature automatically after one disagreement.","Treat the ally's seven votes as legally irrelevant."],1,"Combine parliamentary arithmetic with the stated negotiating condition.","Fifty-five seats fall short; 55 + 7 = 62 clears the 61-seat threshold. The only stated way to secure those additional votes is to remove the tariff.","Budget negotiations can link economic policy details to a government's survival."),
q("The Electoral Shock","A country uses one-seat constituencies under first-past-the-post. Party A wins 40% of votes nationally but narrowly leads in 60% of constituencies; Party B wins 42% nationally but leads in only 40% of constituencies.",[["National vote","A 40% · B 42%"],["District wins","A 60% · B 40%"]],"Which outcome is consistent with the described electoral system?",["Party A wins more seats despite fewer national votes.","Party B must win more seats because of its national popular vote.","Both parties must receive exactly the same seat share as vote share.","The electoral system cannot award seats without a national runoff."],0,"Distinguish the unit used to award seats from the national vote total.","First-past-the-post allocates seats district by district. Winning more constituencies can produce more seats despite a smaller national vote share.","Electoral geography can matter as much as the overall popularity of a party."),
q("The Treaty in Court","Country A signs an environmental treaty requiring emissions reductions. Its constitution says treaties need implementing statutes before citizens can enforce them in court. The cabinet promises compliance but parliament has not acted.",[["International","State has signed a treaty and announced compliance plans."],["Domestic","No implementing statute; legislation is required for court enforcement."]],"Which conclusion follows under these assumptions?",["The cabinet promise alone necessarily grants citizens enforceable statutory rights.","International commitments and domestic court enforceability need separate analysis.","The treaty automatically repeals every emissions statute.","A signed treaty is never relevant to international relations."],1,"Keep international obligations separate from what a domestic court can enforce.","The state may have an international commitment, but the hypothetical constitution requires an implementing law for citizens to enforce treaty provisions domestically.","Domestic legal systems differ in how they integrate international agreements."),
q("The Drought Negotiation","Two countries share a downstream river. Upstream Country A announces it will store additional water during a drought. A treaty requires both governments to exchange flow data before major changes.",[["Physical relationship","Water flows A → B"],["Treaty requirement","Exchange flow data before major operational changes"]],"Which immediate step respects geography and treaty process?",["Have A share the relevant flow information before implementing major changes.","Assume A's reservoir cannot affect B because water always stays upstream.","Declare the river no longer crosses the border.","Ignore the agreement because drought makes all treaties void."],0,"The upstream action may affect the downstream country; the treaty sets a procedural duty.","A should share information before major changes under the stated treaty, allowing both governments to assess downstream impacts. Drought does not itself erase that duty.","Information-sharing provisions can help prevent water scarcity from escalating into diplomatic conflict."),
q("The Price-Control Election","Inflation rises after a global food shortage. A government proposes a price ceiling below equilibrium for staple goods and claims it will guarantee full shelves. Its own economic staff predict demand will exceed supply at the cap.",[["Shock","Supply of food falls"],["Proposed cap","Below equilibrium; excess demand expected"]],"Which cabinet memo best reflects the evidence?",["The cap may make the posted price lower but can create shortages at that price.","The cap guarantees both a lower price and unlimited available supply.","A price ceiling increases harvested output without any input changes.","Any price cap must cause prices to rise by exactly 20%."],0,"Separate the legal sticker price from the quantity actually available.","A binding price ceiling may reduce the posted price while encouraging shortages, queuing or rationing when the amount demanded exceeds what suppliers offer.","Governments often combine price measures with targeted transfers or supply-side efforts."),
q("The Embassy Protest","An ambassador is accused of misconduct by the host government. The diplomat has full criminal immunity under the assumed facts. The host government wants an immediate lawful response without negotiating an immunity waiver.",[["Legal status","Accredited diplomat with immunity"],["Diplomatic goal","Require departure, not prosecution"]],"Which action best meets the stated constraints?",["Declare the ambassador persona non grata.","Arrest and sentence the ambassador in a host-state criminal court.","Cancel diplomatic immunity for every foreigner unilaterally.","Send the case directly to the International Court of Justice for a criminal verdict."],0,"Use the diplomatic mechanism that does not require a criminal conviction.","Persona non grata allows the receiving state to require the sending state to recall a diplomat or end the diplomat's functions, without a host-state criminal trial.","Diplomatic immunity protects official relations but does not mean actions are necessarily lawful or approved."),
q("The Shipping Budget","A coastal government has $4 billion to spend on either a second seaport link or an advertising campaign. A disruption of its only road to the port has repeatedly stranded exports. The link is expected to avert $6 billion of future losses, while the campaign would generate $1 billion in benefits.",[["Infrastructure link","Cost $4b · expected benefit $6b"],["Campaign","Cost $4b · expected benefit $1b"]],"If these are the only options and forecasts are reliable, what best maximizes net benefit?",["Build the second link; estimated net benefit is +$2b.","Run the campaign; estimated net benefit is +$3b.","Both projects have identical net benefits.","Build neither because all infrastructure has negative returns."],0,"Compare benefits minus costs for each option.","The link yields $6b − $4b = +$2b; the campaign yields $1b − $4b = −$3b. The link has the higher estimated net benefit.","Resilient transport networks can be valuable even when no disruption is occurring."),
q("The Supermajority Crisis","A national constitution requires a two-thirds parliamentary vote to change an electoral law. A government holds 58 of 90 seats. Its proposed amendment is popular, but opposition members say they will vote against it.",[["Constitution","Two-thirds of all 90 seats required"],["Government","58 votes pledged"]],"What can the government conclude about its numbers?",["It has enough because 58 exceeds a simple majority.","It needs at least two additional votes to reach 60.","It needs the assent of all 90 members.","It can substitute a public-opinion poll for the supermajority."],1,"Compute the constitutional threshold before assessing political popularity.","Two-thirds of 90 is 60. The government's 58 votes are two short, even though they exceed the ordinary majority threshold.","Constitutional rules can prevent governing majorities from changing fundamental procedures alone."),
q("The Final Cable","A foreign port closes after unrest, blocking your country's only import route for medical supplies. The cabinet plans to seize privately owned local warehouses immediately, but the constitution permits such seizure only under a statute that parliament has not passed.",[["Logistics","Single port closure disrupts imports"],["Constitution","Warehouse seizure requires statutory authority"]],"Which proposal is most defensible under the given facts?",["Seize the warehouses first; a supply crisis automatically waives legal limits.","Pursue alternative supply routes while obtaining lawful authorization for any compulsory seizure.","Assume medical supplies cannot move overland because the port is closed.","Cancel the constitution until international shipments resume."],1,"Treat the logistical emergency and the government's legal powers as separate constraints.","The cabinet can explore alternate procurement and routes while respecting the stated constitutional requirement for any seizure. Urgency does not, by itself, supply missing statutory authority.","The hardest policy problems often require solving operational and constitutional constraints at the same time.")
]

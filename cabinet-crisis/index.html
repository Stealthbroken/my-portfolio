function judge(type,c){if(type==='map'){let p=work.path;if(!p.length||p.at(-1)!==c.end)return {ok:false,message:'The route has not reached its destination.'};let stats=routeStats(c,p);let b=bestRoutes(c)[0];if(!stats.valid)return {ok:false,message:'The route crosses a prohibited or unconnected corridor.'};if(stats.distance>c.budget)return {ok:false,message:'That route exceeds the stated transport distance budget.'};return {ok:stats.score===b.score,message:`Your route has a combined logistics index of ${stats.score}. A safer or shorter valid alternative exists (target: ${b.score}).`}}if(type==='un'){let z=calcUN(c,work.offers);let problems=[];if(z.yes<9)problems.push('fewer than nine affirmative votes');if(z.veto)problems.push('a permanent-member veto');if(z.cost>c.limit)problems.push('negotiation costs exceed the cap');if(z.integrity<c.integrityMin)problems.push('mandate integrity falls below the minimum');return {ok:!problems.length,message:'The resolution fails because of '+problems.join(', ')+'.'}}if(type==='law'){return {ok:work.doc===c.correctDoc&&work.judgment===c.correctResponse,message:work.doc!==c.correctDoc?'Select the controlling document, not merely a supporting statement.':'The legal conclusion is not consistent with the controlling provision.'}}if(type==='coal'){const z=calcCoal(c,work.parties,work.policies);return {ok:z.ok,message:z.reasons.join(' · ')||'That coalition cannot enact the complete agenda.'}}if(type==='intel'){return {ok:c.choices[work.guess]===c.answer,message:'That is not the institution, territory, or geographic feature described by the clues.'}}if(type==='wild'){if(c.mode==='timeline')return {ok:work.timeline.every((v,i)=>c.events[v][1]===c.events.map(t=>t[1]).sort((a,b)=>a-b)[i]),message:'At least one event is in the wrong chronological position.'};let corr=c.items.map((t,i)=>t.ok?i:null).filter(x=>x!==null);return {ok:work.selected.length===corr.length&&corr.every(i=>work.selected.includes(i)),message:'The selected measures do not j function routeStats(c,p){let d=0,r=0;for(let i=1;i<p.length;i++){let e=c.edges.find(e=>(e.a===p[i-1]&&e.b===p[i])||(e.b===p[i-1]&&e.a===p[i]));if(!e||c.ban.includes(p[i])||p.slice(0,i).includes(p[i]))return {valid:false};d+=e.cost;r+=e.risk+c.nodes.find(n=>n.id===p[i]).risk}return {valid:true,distance:d,risk:r,score:d+r*c.riskPenalty}}
function bestRoutes(c){let out=[];function f(path){let here=path.at(-1);if(here===c.end){let x=routeStats(c,path);if(x.valid&&x.distance<=c.budget)out.push({path,...x});return}for(let e of c.edges){let nxt=e.a===here?e.b:e.b===here?e.a:null;if(nxt&&!path.includes(nxt)&&!c.ban.includes(nxt)){let maybe=routeStats(c,[...path,nxt]);if(maybe.valid&&maybe.distance<=c.budget)f([...path,nxt])}}}f([c.start]);return out.sort((a,b)=>a.score-b.score||a.distance-b.distance)}
function calcUN(c,offers){let votes=[...c.base],cost=0,integrity=c.integrityBase;for(let i=0;i<c.offers.length;i++)if(offers.includes(i)){let p=c.offers[i];cost+=p.cost;integrity+=p.integrity;Object.entries(p.effects).forEach(([k,v])=>votes[+k]=v)}return {votes,cost,integrity,yes:votes.filter(v=>v==='yes').length,against:votes.filter(v=>v==='no').length,abstain:votes.filter(v=>v==='abstain').length,veto:votes.slice(0,5).includes('no'),ok:!votes.slice(0,5).includes('no')&&votes.filter(v=>v==='yes').length>=9&&cost<=c.limit&&integrity>=c.integrityMin}}
function calcCoal(c,parties,policies){let p=c.parties.filter((_,i)=>parties.includes(i)),q=c.policies.filter((_,i)=>policies.includes(i)),ids=q.map(x=>x[0]),seats=p.reduce((s,x)=>s+x[1],0),cost=q.reduce((s,x)=>s+x[3],0),majority=Math.floor(c.seatTotal/2)+1;let reasons=[];if(seats<majority)reasons.push(`Need ${majority} seats; have ${seats}`);if(cost>c.budget)reasons.push(`Agenda exceeds fiscal limit ${c.budget}`);for(let goal of c.must)if(!q.some(x=>x[2]===goal))reasons.push('Missing '+goal+' commitment');if(new Set(q.map(x=>x[2])).size!==q.length)reasons.push('Only one policy per priority area can be enacted');for(let a of p){for(let id of a[3])if(ids.includes(id))reasons.push(`${a[0]} vetoes ${c.policies.find(x=>x[0]===id)?.[1]||id}`);if(!a[4].some(id=>ids.includes(id)))reasons.push(`${a[0]} requires one of its priorities in the agenda`)}return {ok:!reasons.length,seats,cost,majority,reasons}}

function renderPlay(){if(stage>=7){view='results';return render()};let base=getCase(stage),z=stageCase(),r=ROUNDS[stage],top=`CASE ${String(stage+1).padStart(2,'0')} OF 07 · ${r.name.toUpperCase()}`,intro=z.final?`${base.subtitle}. Stage ${work.fStage+1} of 3: ${['Trace the logistical route','Negotiate an international response','Establish lawful authority'][work.fStage]}.`:'';let content='';if(z.type==='map')content=renderMap(z.c);if(z.type==='un')content=renderUN(z.c);if(z.type==='law')content=renderLaw(z.c);if(z.type==='coal')content=renderCoal(z.c);if(z.type==='intel')content=renderIntel(z.c);if(z.type==='wild')content=renderWild(z.c);if(z.type==='final-law')content=renderFinalLaw(z.c);let title=z.final?base.title:z.c.title;root.innerHTML=frame()+`<div class="gridplay">${sideBar()}<section class="panel">${frameTitle(top,title,intro||z.c.context||z.c.topic||z.c.situation||z.c.brief||z.c.prompt||'')}${z.final?`<div class="final-step">${[0,1,2].map((x)=>`<span class="${x<=work.fStage?'on':''}">${x+1}. ${['Route','Mandate','Authority'][x]}</span>`).join('')}</div>`:''}${content}${work.msg?note(work.msg,work.msg.includes('cleared')?'good':'warn'):''}${footerActions(canSubmit(z.type,z.c))}<p class="foot">You can explore freely. Only submitting an unsuccessful decision affects your score. ${isSandbox?'Sandbox decisions are not recorded.':'Hints reduce your maximum case score by 15 points.'}</p></div></section></div>`}
function canSubmit(type,c){if(type==='map')return work.path.at(-1)===c.end;if(type==='un')return true;if(type==='law')return work.doc>=0&&work.judgment>=0;if(type==='coal')return work.parties.length&&work.policies.length;if(type==='intel')return work.guess>=0;if(type==='wild')return c.mode==='timeline'||work.selected.length===2;if(type==='final-law')return work.judgment>=0;return false}
function renderMap(c){let p=work.path;let path=p.length?p:[c.start],xmap=Object.fromEntries(c.nodes.map(n=>[n.id,n]));let edges=c.edges.map(e=>{let a=xmap[e.a],b=xmap[e.b],selected=path.some((x,i)=>i&&((path[i-1]===a.id&&x===b.id)||(path[i-1]===b.id&&x===a.id)));return `<line x1="${40+a.x*9.2}" y1="${20+a.y*5.8}" x2="${40+b.x*9.2}" y2="${20+b.y*5.8}" stroke="${selected?'#a94c3e':'#b7c5c4'}" stroke-width="${selected?'7':'3'}" stroke-dasharray="${e.risk?'8 7':''}" opacity="${selected?1:.85}"/>`}).join('');let nodes=c.nodes.map(n=>{let selected=path.includes(n.id),closed=c.ban.includes(n.id),final=n.id===c.end,at=n.id===c.start;let color=closed?'#b7b8b4':selected?'#a34d3f':final?'#44725b':n.risk?'#cc9064':'#3e6475';return `<g data-node="${esc(n.id)}" class="mapnode ${closed?'restricted':''}"><circle cx="${40+n.x*9.2}" cy="${20+n.y*5.8}" r="${selected?16:13}" fill="${color}" stroke="#fff" stroke-width="4"/><text x="${40+n.x*9.2}" y="${20+n.y*5.8-22}" text-anchor="middle" font-size="18" fill="#213842" stroke="#f5f4f0" stroke-width="5" paint-order="stroke" font-weight="700">${esc(n.name)}</text>${(at||final)?`<text x="${40+n.x*9.2}" y="${20+n.y*5.8+35}" text-anchor="middle" font-size="13" fill="#2c5559">${at?'START':'DESTINATION'}</text>`:''}</g>`}).join('');let stats=routeStats(c,path),opt=bestRoutes(c)[0];return `<div class="casebox"><div class="subhead">SCHEMATIC GEOPOLITICAL MAP · ${esc(c.area)}</div><p class="caption">Click connected cities to extend the route. Restricted nodes cannot be used. This is a route graph, not a scale-accurate political map.</p><div class="route-board"><svg class="route-svg" viewBox="0 0 1000 640" role="group" aria-label="Interactive geographic route graph"><defs><pattern id="mapGrid" width="55" height="55" patternUnits="userSpaceOnUse"><path d="M 55 0 L 0 0 0 55" fill="none" stroke="#d6ded9" stroke-width="1"/></pattern></defs><rect width="1000" height="640" fill="#eaf0ee"/><rect width="1000" height="640" fill="url(#mapGrid)"/>${edges}${nodes}</svg></div><div class="route-legend"><span><i class="swatch" style="background:#a34d3f"></i>Selected route</span><span><i class="swatch" style="background:#cc9064"></i>Higher assessed exposure</span><span><i class="swatch" style="background:#b7b8b4"></i>Restricted</span></div><div class="metrics"><div class="metric"><strong>${path.length-1}</strong><small>Legs chosen</small></div><div class="metric"><strong>${stats.valid?stats.distance:0} / ${c.budget}</strong><small>Distance allowance</small></div><div class="metric"><strong>${stats.valid?stats.score:0}</strong><small>Combined route index</small></div></div><div class="pathwords">${path.map(id=>esc(xmap[id]?.name||id)).join(' → ')}</div><div class="actionbar">${btn('Undo waypoint','undo-route','button secondary',path.length<=1)}${btn('Reset route','clear-route','button tertiary',path.length<=1)}</div>${note(`Mandate: find the lowest combined route index without exceeding ${c.budget} distance points. Each leg adds distance; exposure contributes ${c.riskPenalty} times as much. The comparison is based solely on the scenario's stated network.`)}</div>`}
function renderUN(c){let z=calcUN(c,work.offers);return `<div class="casebox"><div class="subhead">SIMULATED SECURITY COUNCIL · SUBSTANTIVE RESOLUTION</div><p>${esc(c.brief)}</p><div class="metrics"><div class="metric"><strong>${z.yes} / 9</strong><small>Affirmative votes required</small></div><div class="metric"><strong>${z.veto?'YES':'NO'}</strong><small>P5 veto active</small></div><div class="metric"><strong>${z.cost} / ${c.limit}</strong><small>Concession budget</small></div><div class="metric"><strong>${z.integrity} / ${c.integrityMin}</strong><small>Integrity / minimum</small></div></div><h3 class="subhead">THE VOTING BOARD</h3><div class="delegate-grid">${z.votes.map((v,i)=>`<div class="delegate ${v}"><small>${i<5?'PERMANENT MEMBER':'ELECTED MEMBER'}</small><strong>${esc(UN_NAMES[i])}</strong><span>${v==='yes'?'IN FAVOUR':v==='no'?'AGAINST':'ABSTAINS'}</span></div>`).join('')}</div><h3 class="subhead">NEGOTIATION TABLE · CLICK TO OFFER</h3><div class="choices">${c.offers.map((o,i)=>`<button class="offer ${work.offers.includes(i)?'sel':''}" data-offer="${i}"><span class="bullet">${work.offers.includes(i)?'✓':'+'}</span><span><strong>${esc(o.name)}</strong><small>${esc(o.detail)}</small></span><span class="pill">${o.cost} pt${o.cost===1?'':'s'} cost</span></button>`).join('')}</div>${note('These delegations and preferences are a fictional negotiation model. The permanent members and substantive-vote rule are real; switching on all concessions is not necessarily optimal.','')}</div>`}
function renderLaw(c){return `<div class="casebox"><div class="subhead">CONSTITUTIONAL CASE FILE · ${esc(c.nation)}</div><p class="caption">Inspect each instrument. Select the legally decisive document, then file your conclusion. These constitutions and disputes are explicitly fictional.</p><div class="doc-tabs">${c.docs.map((d,i)=>`<button class="doctab ${work.doc===i?'on':''}" data-doc="${i}">${esc(d.label)}</button>`).join('')}</div>${work.doc>=0?`<article class="document"><span class="overline">SELECTED EVIDENCE</span><p>${esc(c.docs[work.doc].body)}</p></article>`:`<article class="document"><span class="overline">EVIDENCE LOCKER</span><p>Choose a document above to inspect its contents and designate it as the controlling evidence.</p></article>`}<h3 class="subhead">WHICH LEGAL CONCLUSION FOLLOWS?</h3><div class="choices">${c.responses.map((s,i)=>`<button class="choice ${work.judgment===i?'on':''}" data-judgment="${i}"><span class="bullet">${String.fromCharCode(65+i)}</span><span>${esc(s)}</span></button>`).join('')}</div>${note('Reasoning matters: ordinary statutes and executive interpretations cannot silently change a higher-ranking constitutional rule.')}</div>`}
function renderCoal(c){let z=calcCoal(c,work.parties,work.policies),p=work.policies.map(i=>c.policies[i]);return `<div class="casebox"><div class="subhead">SIMULATED PARLIAMENT · ${c.seatTotal} SEATS</div><p>${esc(c.brief)}</p><div class="metrics"><div class="metric"><strong>${z.seats} / ${z.majority}</strong><small>Coalition seats / majority</small></div><div class="metric"><strong>${z.cost} / ${c.budget}</strong><small>Policy fiscal points</small></div><div class="metric"><strong>${c.must.filter(x=>p.some(y=>y[2]===x)).length} / ${c.must.length}</strong><small>Mandates covered</small></div></div><h3 class="subhead">FORM YOUR COALITION</h3><div class="parties">${c.parties.map((a,i)=>`<button data-party="${i}" class="party ${work.parties.includes(i)?'on':''}"><span class="bullet">${work.parties.includes(i)?'✓':'+'}</span><span><strong>${esc(a[0])}</strong><small>${esc(a[2])} · Veto: ${a[3].map(id=>esc(c.policies.find(x=>x[0]===id)?.[1]||id)).join(', ')||'none'}<br>Wants: ${a[4].map(id=>esc(c.policies.find(x=>x[0]===id)?.[1]||id)).join(' or ')}</small></span><strong>${a[1]}</strong></button>`).join('')}</div><h3 class="subhead">DRAFT THE POLICY AGENDA</h3><div class="choices">${c.policies.map((a,i)=>`<button data-policy="${i}" class="policy ${work.policies.includes(i)?'on':''}"><span class="bullet">${work.policies.includes(i)?'✓':'+'}</span><span><strong>${esc(a[1])}</strong><small>${esc(a[2])} priority · ${a[3]} fiscal points</small></span></button>`).join('')}</div>${z.reasons.length?note(z.reasons.slice(0,3).join(' · '),'warn'):note('Your draft meets the current majority, pledge, fiscal and party-compatibility rules.','good')}</div>`}
function renderIntel(c){return `<div class="casebox"><div class="subhead">CLASSIFIED INTELLIGENCE · IDENTIFY THE REFERENT</div><p>Identify the real-world place, institution, principle or agreement. Reveal only the clues you need; extra clues reduce your score.</p><div class="choices">${c.clues.map((t,i)=>`<div class="clue ${i>=work.clues?'locked':''}"><span class="bullet">${i+1}</span><span>${i<work.clues?esc(t):'Evidence sealed · reveal to read'}</span></div>`).join('')}</div><div class="actionbar">${btn('Unseal another clue','reveal-clue','button secondary',work.clues>=c.clues.length)}<span class="caption">${work.clues}/${c.clues.length} clues revealed</span></div><h3 class="subhead">FILE YOUR IDENTIFICATION</h3><div class="choices">${c.choices.map((t,i)=>`<button class="choice ${work.guess===i?'on':''}" data-guess="${i}"><span class="bullet">${String.fromCharCode(65+i)}</span><span>${esc(t)}</span></button>`).join('')}</div></div>`}
function renderWild(c){if(c.mode==='timeline')return `<div class="casebox"><div class="subhead">CHRONOLOGICAL ANALYSIS</div><p>${esc(c.prompt)}</p><div class="timeline">${work.timeline.map((i,k)=>`<div class="event"><span class="bullet">${k+1}</span><span>${esc(c.events[i][0])}</span><span><button data-move="${k},-1" class="button small secondary" ${k===0?'disabled':''} aria-label="Move event up">↑</button> <button data-move="${k},1" class="button small secondary" ${k===work.timeline.length-1?'disabled':''} aria-label="Move event down">↓</button></span></div>`).join('')}</div>${note('Move items up or down to create a defensible historical chronology. The exact dates appear in the debrief.')}</div>`;return `<div class="casebox"><div class="subhead">POLICY SCREENING</div><p>${esc(c.prompt)}</p><div class="choices">${c.items.map((x,i)=>`<button class="choice ${work.selected.includes(i)?'on':''}" data-wild="${i}"><span class="bullet">${work.selected.includes(i)?'✓':'+'}</span><span>${esc(x.name)}</span></button>`).join('')}</div><p class="caption">Selected ${work.selected.length} of 2 measures</p></div>`}
function renderFinalLaw(c){return `<div class="casebox"><div class="subhead">FINAL AUTHORITY · CROSS-DISCIPLINARY SYNTHESIS</div><p>${esc(c.lawPrompt)}</p><div class="choices">${c.lawChoices.map((t,i)=>`<button class="choice ${work.judgment===i?'on':''}" data-judgment="${i}"><span class="bullet">${String.fromCharCode(65+i)}</span><span>${esc(t)}</span></button>`).join('')}</div>${note('Your earlier route and mandate decisions have been accepted. This final decision must establish a lawful basis for implementation.')}</div>`}
function renderDebrief(){let c=getCase(stage),res=session.results[stage];let explanation=ROUNDS[stage].id==='map'?c.note:ROUNDS[stage].id==='un'?'The substantive-vote rule requires nine affirmative votes and no permanent-member veto. Your negotiated package also respected the model’s budget and mandate-integrity limits.':ROUNDS[stage].id==='law'?c.debrief:ROUNDS[stage].id==='coal'?'The governing coalition has a parliamentary majority and a feasible, supported agenda. Parties cannot be forced to back policies they explicitly veto, and each coalition member needs a substantive programme concession.':ROUNDS[stage].id==='intel'?c.why:ROUNDS[stage].id==='wild'?c.why:c.conclusion;return root.innerHTML=frame()+`<section class="panel"><div class="casebody"><span class="overline">CASE ${stage+1} · DEBRIEF</span><h2 class="serif">${res.success?'Decision filed.':'Case archived.'}</h2><div class="result-hero"><div class="score">${res.points}<small> / 100</small></div><p>${res.success?'A defensible solution, filed to the daily record.':'No points awarded for this case.'}</p></div><h3 class="serif">What mattered</h3><p>${esc(explanation||'Your decision was reviewed under the stated fictional scenario constraints.')}</p>${ROUNDS[stage].id==='wild'&&c.mode==='timeline'?note('Chronology: '+c.events.slice().sort((a,b)=>a[1]-b[1]).map(x=>x[0]+' ('+x[1]+')').join(' → ')):''}${ROUNDS[stage].id==='map'?note('Optimal schematic route: '+bestRoutes(c)[0].path.map(id=>c.nodes.find(n=>n.id===id).name).join(' → ')):''}${ROUNDS[stage].id==='law'?note('Controlling instrument: '+c.docs[c.correctDoc].label):''}<div class="actionbar">${btn(stage===6?'View the results':'Continue to the next case','next')}</div></div></section>`}
function calcStreak(){let h=history(),d=dayNow(),n=0;for(let i=0;i<400;i++){let s=h[d];if(!s?.finished){if(i===0){d=dateOffset(d,-1);continue}break}n++;d=dateOffset(d,-1)}return n}
function renderResults(){let total=scores(),grid=session.results.map(x=>x?.success?x.points>=85?'■':x.points>=50?'▣':'▤':'□').join('');root.innerHTML=frame()+`<section class="panel"><div class="casebody"><span class="overline">DOSSIER COMPLETE · ${esc(playDate)}</span><h2 class="serif">Your Cabinet Verdict.</h2><div class="result-hero"><div class="score">${total}<small> / 700</small></div><h3 class="serif">${rank(total)}</h3><p>Seven decisions. One daily record. ${isSandbox?'Sandbox run: your official results were not changed.':`Current daily streak: ${calcStreak()}.`}</p></div><h3 class="subhead">YOUR CASE REPORT</h3><div class="result-list">${ROUNDS.map((r,i)=>`<div class="result-row"><span class="bullet">${i+1}</span><span><strong>${esc(r.name)}</strong><small>${esc(getCase(i).title)}</small></span><strong>${session.results[i]?.points||0} / 100</strong></div>`).join('')}</div><div class="actionbar">${btn('Copy shareable results','share')}${btn('Browse the archive','archive','button secondary')}${isSandbox?btn('Back to curator','curator','button tertiary'):''}</div><p class="foot">${esc(grid)} · The share text contains your scores, not puzzle answers.</p></div></section>`}
function renderArchive(){let arr=Object.values(history()).sort((a,b)=>b.date.localeCompare(a.date));root.innerHTML=`<div class="hero"><span class="overline">YOUR PRIVATE LOCAL RECORD</span><h1 class="serif">The Archive.</h1><p>Every completed daily briefing is kept in this browser. Curator rehearsals are excluded.</p></div><div class="panel"><div class="casebody"><h3 class="serif">Filed reports</h3>${arr.length?arr.map(x=>`<div class="entry"><span><strong>${esc(ordinal(x.date))}</strong><small>${x.finished?'Completed':'In progress'} · ${completed(x)} of 7 cases</small></span><strong>${scores(x)} / 700</strong></div>`).join(''):'<p>No briefing records yet. Your first submitted decision starts the archive.</p>'}<div class="actionbar">${btn('Return to today','today')}</div></div></div>`}
function showHow(){alert('Seven daily cases: 1 map route, 2 UN concessions, 3 constitutional file, 4 parliamentary coalition, 5 progressive clues, 6 policy or history, 7 a connected three-stage crisis. Exploration is free. Submit a completed answer to score up to 100 per case. Failed submissions cost 32 points; hints cost 15; extra intelligence clues cost 15 each. Scores and streaks are stored in your browser. The curator can plan and publish daily cases across devices through a protected backend.')}
function share(){let lines=ROUNDS.map((r,i)=>`${i+1}. ${session.results[i]?.success?'●':'○'} ${session.results[i]?.points||0}/100`).join('\n');let s=`CABINET CRISIS · ${playDate}\n${scores()}/700 · ${rank(scores())}\n${lines}\nhttps://my-portfolio-chi-three-5c28s8eyw0.vercel.app/cabinet-crisis/`;if(navigator.share){navigator.share({title:'Cabinet Crisis',text:s}).catch(()=>{})}else navigator.clipboard.writeText(s).then(()=>toast('Report copied')).catch(()=>prompt('Copy report',s))}
function allowMapNode(id){let {type,c}=stageCase();if(type!=='map')return;let p=work.path.length?work.path:[c.start];if(c.ban.includes(id)){toast('That corridor is restricted.');return}if(p.at(-1)===id)return;if(p.includes(id)){toast('No repeated waypoints; undo to backtrack.');return}let prev=p.at(-1),edge=c.edges.find(e=>(e.a===prev&&e.b===id)||(e.b===prev&&e.a===id));if(!edge){toast('Select a directly connected city.');return}work.path=[...p,id];work.msg='';render()}
function doChoice(node){let a=node.closest('[data-action]');if(a){let v=a.dataset.action;if(v==='begin')return begin();if(v==='next')return nextCase();if(v==='submit')return doSubmit();if(v==='hint'){work.hint=!work.hint;if(work.hint)work.everHint=true;let type=stageCase().type;let hint={map:'A corridor with fewer legs can be a worse choice when it crosses a higher-exposure node. Check both distance and adjusted risk.',un:'A permanent member may abstain without vetoing a substantive resolution. Your proposal also needs at least nine affirmative votes and must preserve its mandate.',law:'Identify the highest-ranking legal instrument that controls the precise disputed action. Consider whether a statute could override it.',coal:'A simple majority is not enough. Every coalition partner needs a policy win and no partner can be asked to accept a policy it explicitly vetoes.',intel:'Compare each clue with all four candidate referents before revealing another. A location and an institution may sound similar in early clues.',wild:'Check the wording of each objective, not just which option sounds appealing. Each item must satisfy the exact constraints.','final-law':'International political support and binding authorization are different things. Which institution has the relevant legal authority?'};work.msg=work.hint?'HINT · '+(hint[type]||'Check all the conditions.') : '';return render()}if(v==='skip')return finishCase(false);if(v==='undo-route'){work.path=work.path.slice(0,-1);work.msg='';return render()}if(v==='clear-route'){work.path=[];work.msg='';return render()}if(v==='reveal-clue'){work.clues=Math.min(stageCase().c.clues.length,work.clues+1);return render()}if(v==='how')return showHow();if(v==='share')return share();if(v==='archive'){view='archive';return render()}if(v==='today')return openDate();if(v==='curator'){view='curator';return render()}if(v==='curator-auth')return curatorLogin();if(v==='curator-load')return curatorLoad();if(v==='curator-publish')return curatorPublish();if(v==='curator-remove')return curatorUnpublish();if(v==='curator-preview')return openDate(curatorDate,true,curatorDraft);if(v==='curator-fill')return curatorFill();if(v==='curator-reset'){curatorDraft=generatedLineup(curatorDate);return render()}if(v==='curator-logout'){curatorAuth=false;curatorKey='';return render()}return}let n=node.closest('[data-node]');if(n)return allowMapNode(n.dataset.node);let off=node.closest('[data-offer]');if(off){let i=+off.dataset.offer;work.offers.includes(i)?work.offers=work.offers.filter(x=>x!==i):work.offers.push(i);work.msg='';return render()}let d=node.closest('[data-doc]');if(d){work.doc=+d.dataset.doc;return render()}let j=node.closest('[data-judgment]');if(j){work.judgment=+j.dataset.judgment;return render()}let p=node.closest('[data-party]');if(p){let i=+p.dataset.party;work.parties.includes(i)?work.parties=work.parties.filter(x=>x!==i):work.parties.push(i);return render()}let pol=node.closest('[data-policy]');if(pol){let i=+pol.dataset.policy;work.policies.includes(i)?work.policies=work.policies.filter(x=>x!==i):work.policies.push(i);return render()}let g=node.closest('[data-guess]');if(g){work.guess=+g.dataset.guess;return render()}let w=node.closest('[data-wild]');if(w){let i=+w.dataset.wild;work.selected.includes(i)?work.selected=work.selected.filter(x=>x!==i):work.selected.length<2&&work.selected.push(i);return render()}let m=node.closest('[data-move]');if(m){let [i,d]=m.dataset.move.split(',').map(Number),j=i+d;if(j>=0&&j<work.timeline.length)[work.timeline[i],work.timeline[j]]=[work.timeline[j],work.timeline[i]];return render()}let date=node.closest('[data-plan-date]');if(date){curatorDate=date.dataset.planDate;return curatorLoad()} }
root.addEventListener('click',e=>doChoice(e.target));
$('brand').addEventListener('click',()=>openDate());$('nav-today').addEventListener('click',()=>openDate());$('nav-archive').addEventListener('click',()=>{view='archive';render()});$('nav-curator').addEventListener('click',()=>{view='curator';render()});
// Curator access is authenticated only by the server; the HTML contains no credentials.
async function curateFetch(method,params={},body=null){let url=API+(Object.keys(params).length?'?'+new URLSearchParams(params):'');let headers={'Content-Type':'application/json'};if(curatorKey)headers['X-Curator-Key']=curatorKey;let r=await fetch(url,{method,headers,body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(15000)});let j=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(j.error||`Request failed (${r.status})`);return j}
async function curatorLogin(){let input=$('admin-key');let key=input?.value?.trim();if(!key){toast('Enter the curator access key first.');return}curatorKey=key;curatorBusy=true;try{await curateFetch('GET',{verify:'1'});curatorAuth=true;toast('Curator access verified');curatorLoad()}catch(e){curatorKey='';toast('Access denied: '+e.message);curatorBusy=false}}
async function curatorLoad(){if(!curatorAuth)return;curatorBusy=true;try{let [day,near]=await Promise.all([curateFetch('GET',{date:curatorDate}),curateFetch('GET',{from:dateOffset(dayNow(),0),days:'21'})]);publishedDates=Object.fromEntries((near.schedules||[]).map(x=>[x.date,x.caseIds]));curatorDraft=validLineup(day.caseIds)?day.caseIds:generatedLineup(curatorDate);notice=day.caseIds?'Loaded published lineup for '+curatorDate:'Showing an unpublished draft for '+curatorDate}catch(e){notice=e.message;curatorDraft=generatedLineup(curatorDate)}curatorBusy=false;view='curator';render()}
async function curatorPublish(){if(!validLineup(curatorDraft)){toast('Every slot must contain a valid case');return}curatorBusy=true;try{await curateFetch('POST',{}, {date:curatorDate,caseIds:curatorDraft});notice='Published '+curatorDate+' for all players. Changes to an already-started local daily dossier will not interrupt that player.';publishedDates[curatorDate]=[...curatorDraft];toast('Published successfully')}catch(e){notice='Publish failed: '+e.message;toast(notice)}curatorBusy=false;render()}
async function curatorUnpublish(){curatorBusy=true;try{await curateFetch('DELETE',{}, {date:curatorDate});delete publishedDates[curatorDate];curatorDraft=generatedLineup(curatorDate);notice='Removed published override; the date now uses the deterministic default.';toast('Override removed')}catch(e){notice=e.message;toast('Remove failed')}curatorBusy=false;render()}
async function curatorFill(){if(!confirm('Publish generated lineups to the NEXT 14 UNSCHEDULED days, without replacing existing published dates?'))return;curatorBusy=true;try{let days=[];for(let i=1;i<=14;i++){let date=dateOffset(dayNow(),i);if(!publishedDates[date])days.push({date,caseIds:generatedLineup(date)})}if(!days.length){notice='Every date in the upcoming two weeks is already scheduled.'}else{await curateFetch('POST',{}, {days});days.forEach(x=>publishedDates[x.date]=x.caseIds);notice='Published '+days.length+' unscheduled future briefing(s).'}toast(notice)}catch(e){notice=e.message;toast('Batch operation failed')}curatorBusy=false;render()}
root.addEventListener('change',e=>{if(e.target.id==='plan-date'){curatorDate=e.target.value;curatorLoad()}if(e.target.dataset.slot!==undefined){let i=+e.target.dataset.slot;curatorDraft[i]=e.target.value;notice='Unsaved changes · Preview or publish the revised lineup';render()}});
function renderCurator(){root.innerHTML=`<div class="hero"><div><span class="overline">PRIVATE EDITORIAL TOOLS</span><h1 class="serif">The Curator's Desk.</h1><p>Rehearse as many days as you want, assemble future issues, and publish the shared schedule. Your personal daily streak stays untouched.</p></div></div>${curatorAuth?renderCuratorDashboard():`<section class="panel admin"><div class="adminbody"><h2 class="serif">Authorize your desk.</h2><p>The editorial key is checked by the server and never saved to browser storage or included in public source code.</p><div class="field"><label for="admin-key">Private curator access key</label><input id="admin-key" type="password" autocomplete="off" placeholder="Enter your private key"/></div><div class="actionbar">${btn('Unlock curator controls','curator-auth')}</div>${notice?note(notice,'warn'):''}</div></section>`}`}
function renderCuratorDashboard(){let today=dayNow();return `<div class="admin"><section class="panel"><div class="adminbody"><div class="adminhead"><div><span class="overline">ISSUE PLANNER</span><h2 class="serif">Arrange tomorrow's news.</h2></div>${btn('Lock desk','curator-logout','button secondary small')}</div><div class="datebar"><div class="field"><label for="plan-date">Issue date</label><input type="date" id="plan-date" value="${esc(curatorDate)}" min="2026-01-01"/></div>${btn('Preview this issue · sandbox','curator-preview','button secondary')}</div><div class="adminslots">${ROUNDS.map((r,i)=>`<div class="adminslot"><span class="ord">${String(i+1).padStart(2,'0')}</span><div class="field"><label>${esc(r.name)}</label><select data-slot="${i}" class="selectsmall">${BANK[r.id].map(x=>`<option value="${esc(x.id)}" ${curatorDraft[i]===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><span class="caption">${BANK[r.id].length} cases</span></div>`).join('')}</div><div class="actionbar">${btn(curatorBusy?'Publishing…':'Publish this issue','curator-publish','button',curatorBusy)}${btn('Reset to automatic lineup','curator-reset','button secondary',curatorBusy)}${btn('Remove published override','curator-remove','button tertiary',curatorBusy)}</div>${note(notice||'No changes published yet.')}</div></section><section class="panel"><div class="adminbody"><span class="overline">EDITORIAL CALENDAR</span><h2 class="serif">The next three weeks.</h2><p class="caption">Select a day to arrange its case lineup. Green labels indicate a published curated override.</p><div class="row" style="flex-wrap:wrap">${Array.from({length:21},(_,i)=>{let d=dateOffset(today,i);return `<button class="datechip ${d===curatorDate?'active':''}" data-plan-date="${d}"><strong>${esc(d.slice(5))}</strong><span>${publishedDates[d]?'Published':'Automatic'}</span></button>`}).join('')}</div><div class="actionbar">${btn('Auto-plan next 14 unscheduled days','curator-fill','button secondary',curatorBusy)}</div><h3 class="serif">Editorial principles</h3><p>Every issue has exactly one case from each discipline. A curator-set schedule is shared with new visitors. Rehearsals are unlimited and never write to the public schedule. Existing player attempts remain stable after publication edits.</p>${note('Security: the backend requires a private access key for writes. Anyone can read the published calendar, but cannot change it without that key.')}</div></section></div>`}
root.innerHTML='<section class="panel"><div class="casebody"><span class="overline">PREPARING THE DOSSIER</span><p>Loading today’s briefing…</p></div></section>';
openDate().catch(e=>{root.innerHTML=`<section class="panel"><div class="casebody"><h2>Unable to load the game</h2><p>${esc(e.message)}</p></div></section>`});

</script>
</body></html>
